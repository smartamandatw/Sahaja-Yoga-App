<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>常見問與答 — Sahaja Yoga</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #F0E8D0;
  --text:     #1C1A17;
  --gold:     #C9A84C;
  --gold-dim: rgba(201,168,76,0.22);
  --muted:    #7a6e5f;
  --card:     rgba(255,255,255,0.72);
  --card-b:   rgba(201,168,76,0.20);
  --soft:     rgba(201,168,76,0.10);
  --bg-blur:  rgba(240,232,208,0.94);  /* nav 毛玻璃背景 */
  --bg-hint:  rgba(240,232,208,0.85);  /* scroll hint 背景 */
  --shadow-open: rgba(201,168,76,0.14); /* 展開卡片陰影 */
  --card-open-b: rgba(201,168,76,0.40); /* 展開卡片邊框 */
  --card-white:  rgba(255,255,255,0.60); /* 內層白卡底色 */
  --card-white2: rgba(255,255,255,0.80); /* 內層白卡底色（較深）*/
  --btn-gold:    rgba(201,168,76,0.25);  /* 金色按鈕底色 */
  --btn-gold-active: rgba(201,168,76,0.45); /* 金色按鈕 active */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

html,body{width:100%;min-height:100%;font-family:"Noto Sans TC",sans-serif;
background:var(--bg);color:var(--text);overflow-x:hidden;
background-image: url("https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/png/app_back_ground.png");
background-size: cover;
background-position: center;}

body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 15% 0%,rgba(201,168,76,.12) 0%,transparent 55%),
             radial-gradient(ellipse at 85% 100%,rgba(201,168,76,.09) 0%,transparent 55%);}

/* ── TOP NAV ── */
.top-nav{position:sticky;top:0;z-index:20;background:rgba(240,232,208,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--gold-dim);padding:14px 16px 12px;display:flex;align-items:center;gap:12px;}
.back-btn {
  font-family:"Noto Sans TC",sans-serif; font-size:13px;
  color:var(--muted); background:var(--soft);
  border:1px solid var(--gold); border-radius:10px;
  padding:6px 12px; cursor:pointer;
  transition:background .2s,color .2s; white-space:nowrap;
}
.back-btn:active { background:var(--gold-dim); color:var(--text); }
.nav-title{font-family:"Noto Serif TC",serif;font-size:clamp(14px,3.8vw,16px);color:var(--text);letter-spacing:.1em;}

/* ── HERO ── */
.hero{padding:32px 22px 22px;text-align:center;position:relative;z-index:1;animation:fadeUp .6s ease both;}
.hero-tag{display:inline-block;background:var(--bg);
          color:var(--text);font-size:11px;letter-spacing:3px;padding:4px 14px;
          border-radius:20px;margin-bottom:14px;border:1px solid var(--gold-dim);}
.hero h1{font-family:"Noto Serif TC",serif;font-size:clamp(1.5rem,5vw,1.9rem);font-weight:700;color:var(--text);line-height:1.4;margin-bottom:10px;}
.hero h1 em{font-style:normal;color:var(--gold);}
.hero-desc{font-size:13.5px;color:var(--muted);line-height:1.9;max-width:300px;margin:0 auto;}

/* ── OUTER CATEGORY CARDS ── */
.cats{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:0 16px;margin-bottom:48px;}

.cat-card{background:var(--card);border-radius:20px;border:1px solid var(--card-b);overflow:hidden;backdrop-filter:blur(8px);transition:box-shadow .25s;opacity:0;animation:fadeUp .5s ease both;}
.cat-card:nth-child(1){animation-delay:.06s} .cat-card:nth-child(2){animation-delay:.12s}
.cat-card:nth-child(3){animation-delay:.18s} .cat-card:nth-child(4){animation-delay:.24s}
.cat-card:nth-child(5){animation-delay:.30s} .cat-card:nth-child(6){animation-delay:.36s}
.cat-card.open{box-shadow:0 6px 28px rgba(201,168,76,.14);border-color:var(--gold-dim);}

.cat-header{display:flex;align-items:center;gap:14px;padding:17px 18px;cursor:pointer;user-select:none;}
.cat-icon{width:44px;height:44px;border-radius:14px;flex-shrink:0;background:var(--soft);border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
.cat-card.open .cat-icon{transform:scale(1.1) rotate(-5deg);}
.cat-titles{flex:1;min-width:0;}
.cat-name{font-family:"Noto Serif TC",serif;font-size:1rem;font-weight:700;color:var(--text);}
.cat-count{font-size:11.5px;color:var(--muted);margin-top:2px;}
.cat-arrow{font-size:13px;color:var(--muted);flex-shrink:0;transition:transform .3s,color .2s;}
.cat-card.open .cat-arrow{transform:rotate(90deg);color:var(--gold);}

.cat-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .35s;opacity:0;}
.cat-card.open .cat-body{max-height:4000px;opacity:1;}
.cat-body-inner{padding:0 14px 16px;}

/* ── FAQ ITEMS inside each category ── */
.faq-item{border-radius:14px;background:rgba(255,255,255,.55);border:1px solid var(--gold-dim);margin-bottom:7px;overflow:hidden;transition:background .2s,border-color .2s;}
.faq-item.open{background:var(--card-white2);border-color:var(--card-open-b);}

.faq-q{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 15px;cursor:pointer;font-family:"Noto Serif TC",serif;font-size:clamp(13px,3.6vw,14.5px);color:var(--text);line-height:1.65;letter-spacing:.03em;user-select:none;}
.faq-q:active{opacity:.75;}

.faq-chevron{flex-shrink:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:11px;transition:transform .28s ease;margin-top:1px;}
.faq-item.open .faq-chevron{transform:rotate(180deg);}

.faq-a-wrap{max-height:0;overflow:hidden;transition:max-height .38s ease,opacity .28s;opacity:0;}
.faq-item.open .faq-a-wrap{max-height:1000px;opacity:1;}
.faq-a{padding:0 15px 15px;padding-top:2px;font-size:clamp(12.5px,3.4vw,13.5px);color:var(--muted);line-height:1.95;white-space:pre-line;border-top:1px solid var(--gold-dim);}

/* ── LOADING ── */
.loading{display:flex;align-items:center;justify-content:center;padding:80px 24px;font-family:"Noto Serif TC",serif;font-size:14px;color:var(--muted);letter-spacing:.15em;position:relative;z-index:1;}

/* ── FOOTER ── */
.footer-note{position:relative;z-index:1;margin:0 16px 48px;background:var(--card);border-radius:20px;border:1px solid var(--card-b);padding:22px;backdrop-filter:blur(8px);text-align:center;animation:fadeUp .5s .45s ease both;opacity:0;animation-fill-mode:forwards;}
.footer-note p{font-family:"Noto Serif TC",serif;font-size:13px;color:var(--muted);line-height:2;}
.footer-note em{font-style:normal;color:var(--gold);}

/* ── SCROLL HINT ── */
.scroll-hint{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:30;pointer-events:none;
  width:40px;height:40px;border-radius:50%;
  background:var(--bg-hint);
  border:1.5px solid var(--gold);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--gold);
  opacity:0;transition:opacity .4s;
  animation:scrollBounce 1.6s ease-in-out infinite;
}
.scroll-hint.visible{opacity:1;pointer-events:auto;}
@keyframes scrollBounce{
  0%,100%{transform:translateX(-50%) translateY(0);}
  50%{transform:translateX(-50%) translateY(5px);}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<button class="back-btn" style="position:sticky;top:16px;margin:16px 0 0 16px;z-index:20;display:inline-block;" onclick="goBack()">← 返回</button>

<div class="hero">
  <h1>你想問的，<em>這裡大概都有</em></h1>
  <span class="hero-tag">點開分類，找到你的問題</span>
</div>

<div class="cats" id="cats"><div class="loading">載入中⋯⋯</div></div>

<div class="footer-note" id="footer-note" style="display:none">
  <p>還有其他問題嗎？<br><em>歡迎透過 LINE 或 Email 直接問我們</em></p>
</div>

<div class="scroll-hint" id="scrollHint">&#8964;</div>

<script>
const BASE = 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/';
let openCat = -1;

// extract emoji from category string like "🌱 開始練習"
function splitCat(str) {
  const m = str.match(/^(\S+)\s+(.+)$/);
  return m ? { emoji: m[1], name: m[2] } : { emoji: '✦', name: str };
}

function toggleCat(i) {
  const cards = document.querySelectorAll('.cat-card');
  if (openCat === i) { cards[i].classList.remove('open'); openCat = -1; }
  else {
    if (openCat >= 0) cards[openCat].classList.remove('open');
    cards[i].classList.add('open'); openCat = i;
    setTimeout(() => cards[i].scrollIntoView({ behavior:'smooth', block:'nearest' }), 60);
  }
}

function toggleFaq(item) {
  const isOpen = item.classList.contains('open');
  // close siblings
  item.closest('.cat-body-inner').querySelectorAll('.faq-item').forEach(el => el.classList.remove('open'));
  if (!isOpen) item.classList.add('open');
}

function renderCats(data) {
  const wrap = document.getElementById('cats');
  wrap.innerHTML = data.map((cat, i) => {
    const { emoji, name } = splitCat(cat.category);
    const faqs = cat.items.map((item, j) => `
      <div class="faq-item" id="faq-${i}-${j}">
        <div class="faq-q" onclick="toggleFaq(this.closest('.faq-item'))">
          <span>${item.q}</span>
          <span class="faq-chevron">▼</span>
        </div>
        <div class="faq-a-wrap">
          <div class="faq-a">${item.a}</div>
        </div>
      </div>`).join('');

    return `
      <div class="cat-card" id="cat-${i}">
        <div class="cat-header" onclick="toggleCat(${i})">
          <div class="cat-icon">${emoji}</div>
          <div class="cat-titles">
            <div class="cat-name">${name}</div>
            <div class="cat-count">${cat.items.length} 個問題</div>
          </div>
          <span class="cat-arrow">▶</span>
        </div>
        <div class="cat-body">
          <div class="cat-body-inner">${faqs}</div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('footer-note').style.display = '';
}

function goBack() {
  if (document.referrer) history.back();
  else window.location.href = 'menu.html';
}

fetch(BASE + 'faq.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => { renderCats(data); setTimeout(updateScrollHint, 200); })
  .catch(() => {
    document.getElementById('cats').innerHTML =
      '<div class="loading">載入失敗，請稍後再試。</div>';
  });

// ── scroll hint ──
const scrollHint = document.getElementById('scrollHint');
function updateScrollHint() {
  const scrollable = document.documentElement.scrollHeight > window.innerHeight + 40;
  const nearBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 60;
  scrollHint.classList.toggle('visible', scrollable && !nearBottom);
}
window.addEventListener('scroll', updateScrollHint, { passive:true });
window.addEventListener('resize', updateScrollHint);
setTimeout(updateScrollHint, 600);

</script>
</body>
</html>
