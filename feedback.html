<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sahaja Yoga — 覺察回饋</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"Noto Sans TC",sans-serif; }

  #bg {
    position:fixed; inset:0; z-index:0;
    background-size:cover; background-position:center;
  }
  #overlay { position:fixed; inset:0; z-index:1; background:rgba(10,12,8,0.55); }

  .page {
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:0 6vw;
    opacity:0; pointer-events:none;
    transition:opacity 0.6s ease;
  }
  .page.show { opacity:1; pointer-events:auto; }

  .page-title {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(17px,4.8vw,22px);
    color:rgba(240,232,210,0.9);
    letter-spacing:0.2em; text-align:center;
    margin-bottom:5vh; margin-top:10vh;
    text-shadow:0 1px 8px rgba(0,0,0,0.4);
  }

  /* 感受選項 */
  .feeling-list {
    display:flex; flex-direction:column;
    gap:12px; width:100%; max-width:340px;
  }

  .feeling-item {
    padding:14px 20px; border-radius:12px;
    border:0.5px solid rgba(255,255,255,0.2);
    background:rgba(230,220,200,0.1); backdrop-filter:blur(8px);
    color:rgba(240,232,210,0.85); font-family:"Noto Serif TC",serif;
    font-size:clamp(14px,4vw,16px); letter-spacing:0.08em;
    cursor:pointer; text-align:left;
    display:flex; align-items:center; gap:12px;
    transition:background 0.2s, border-color 0.2s, transform 0.1s;
  }
  .feeling-item:active { transform:scale(0.97); }
  .feeling-item.selected {
    background:rgba(230,220,200,0.28);
    border-color:rgba(240,232,210,0.7);
  }
  .feeling-emoji { font-size:22px; flex-shrink:0; }

  /* 感受說明 */
  .response-box {
    width:100%; max-width:340px;
    background:rgba(230,220,200,0.12); backdrop-filter:blur(8px);
    border:0.5px solid rgba(255,255,255,0.2);
    border-radius:12px; padding:16px 20px;
    font-family:"Noto Serif TC",serif;
    font-size:clamp(13px,3.5vw,15px);
    color:rgba(240,232,210,0.8); line-height:1.9; letter-spacing:0.08em;
    text-align:center; margin-bottom:4vh;
    display:none;
  }
  .response-box.show { display:block; }

  /* 日誌輸入 */
  .journal-wrap {
    width:100%; max-width:340px;
    display:flex; flex-direction:column; gap:12px;
  }
  .journal-label {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(13px,3.5vw,15px);
    color:rgba(240,232,210,0.6); letter-spacing:0.1em; text-align:center;
  }
  .journal-input {
    width:100%; padding:14px 16px; border-radius:12px;
    background:rgba(230,220,200,0.1); backdrop-filter:blur(8px);
    border:0.5px solid rgba(255,255,255,0.2);
    color:#F0E8D0; font-family:"Noto Serif TC",serif;
    font-size:clamp(14px,4vw,16px); line-height:1.7;
    resize:none; outline:none;
    -webkit-appearance:none;
  }
  .journal-input::placeholder { color:rgba(240,232,210,0.35); }

  /* 按鈕 */
  .action-btn {
    padding:14px 44px; border-radius:999px;
    background:rgba(210,200,178,0.52); backdrop-filter:blur(10px);
    border:0.5px solid rgba(255,255,255,0.45);
    color:#1C1609; font-family:"Noto Sans TC",sans-serif;
    font-size:clamp(15px,4vw,17px); letter-spacing:0.1em;
    cursor:pointer; transition:background 0.2s, transform 0.1s;
    margin-top:2vh;
  }
  .action-btn:active { transform:scale(0.97); }
  .skip-btn {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(15px,4vw,17px);
    color:rgba(240,232,210,0.4); cursor:pointer;
    letter-spacing:0.08em; margin-top:10px;
    background:none; border:none;
  }

  /* 統計畫面 */
  .stats-wrap {
    display:flex; flex-direction:column;
    align-items:center; gap:20px;
    width:100%; max-width:340px;
  }
  .stats-streak {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(48px,14vw,72px);
    color:#F0E8D0; line-height:1;
    text-shadow:0 2px 12px rgba(0,0,0,0.4);
  }
  .stats-label {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(18px,5vw,22px);
    color:rgba(240,232,210,0.7); letter-spacing:0.15em;
    margin-top:-8px;
  }
  .stats-duration {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(16px,4.5vw,20px);
    color:rgba(240,232,210,0.5); letter-spacing:0.1em;
  }
  .stats-divider {
    width:60px; height:0.5px;
    background:rgba(240,232,210,0.2);
  }
  .stats-msg {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(14px,4vw,16px);
    color:rgba(240,232,210,0.75); letter-spacing:0.1em;
    text-align:center; line-height:1.8;
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="overlay"></div>

<!-- 步驟一：選感受 -->
<div class="page show" id="step1">
  <div class="page-title">靜坐完成<br>你感受到什麼了嗎？</div>
  <div class="feeling-list" id="feelingList"></div>
  <div class="response-box" id="responseBox"></div>
  <button class="action-btn" id="nextBtn" style="display:none" onclick="goToJournal()">繼續 →</button>
  <button class="skip-btn" onclick="skipToStats()">略過，直接完成</button>
</div>

<!-- 步驟二：寫日誌 -->
<div class="page" id="step2">
  <div class="page-title">記錄這次的感受</div>
  <div class="journal-wrap">
    <div class="journal-label">（可以不填）</div>
    <textarea class="journal-input" id="journalInput" rows="5" placeholder="今天的靜坐感覺如何…"></textarea>
  </div>
  <button class="action-btn" onclick="saveAndShowStats()">完成</button>
  <button class="skip-btn" onclick="showStats()">略過</button>
</div>

<!-- 步驟三：統計 -->
<div class="page" id="step3">
  <div class="stats-wrap">
    <div class="stats-streak" id="statsStreak">1</div>
    <div class="stats-label">連續靜坐天數</div>
    <div class="stats-duration" id="statsDuration"></div>
    <div class="stats-divider"></div>
    <div class="stats-msg" id="statsMsg">繼續保持，每天一點點<br>內在的改變正在發生</div>
    <button class="action-btn" onclick="goHome()" style="margin-top:3vh;">回到主畫面</button>
  </div>
</div>

<script>
  const BASE = 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/';

  // 設定背景
  const bgUrl = localStorage.getItem('sahaja_bg_url') || 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/forest.png';
  console.log('背景圖:', bgUrl);
  document.getElementById('bg').style.backgroundImage = "url('" + bgUrl + "')";

  // 讀取統計
  const streak = parseInt(localStorage.getItem('sahaja_streak') || '1');
  const duration = parseInt(localStorage.getItem('sahaja_last_duration') || '0');
  const m = Math.floor(duration/60);
  const s = duration % 60;

  let selFeeling = null;

  // 載入感受選項
  fetch(BASE + 'feelings.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      const container = document.getElementById('feelingList');
      list.forEach(function(f) {
        const item = document.createElement('div');
        item.className = 'feeling-item';
        item.innerHTML = '<span class="feeling-emoji">' + f.emoji + '</span><span>' + f.label + '</span>';
        item.addEventListener('click', function() {
          document.querySelectorAll('.feeling-item').forEach(function(i) { i.classList.remove('selected'); });
          item.classList.add('selected');
          selFeeling = f;
          // 顯示對應說明
          const box = document.getElementById('responseBox');
          box.textContent = f.response;
          box.classList.add('show');
          document.getElementById('nextBtn').style.display = 'block';
        });
        container.appendChild(item);
      });
    })
    .catch(function() {
      console.log('feelings.json 載入失敗');
    });

  function goToJournal() {
    document.getElementById('step1').classList.remove('show');
    document.getElementById('step2').classList.add('show');
  }

  function skipToStats() {
    document.getElementById('step1').classList.remove('show');
    showStats();
  }

  function saveAndShowStats() {
    const text = document.getElementById('journalInput').value.trim();
    if (text) {
      // 存日誌
      const journals = JSON.parse(localStorage.getItem('sahaja_journals') || '[]');
      journals.push({
        date: new Date().toLocaleDateString('zh-TW'),
        duration: m + '分' + s + '秒',
        feeling: selFeeling ? selFeeling.label : '',
        text: text
      });
      // 只保留最近 50 筆
      if (journals.length > 50) journals.shift();
      localStorage.setItem('sahaja_journals', JSON.stringify(journals));
    }
    showStats();
  }

  function showStats() {
    document.getElementById('step2').classList.remove('show');
    document.getElementById('step3').classList.add('show');

    document.getElementById('statsStreak').textContent = streak;
    document.getElementById('statsDuration').textContent = '本次靜坐 ' + m + ' 分 ' + s + ' 秒';

    // 連續天數對應鼓勵語
    let msg = '繼續保持，每天一點點<br>內在的改變正在發生';
    if (streak >= 30) msg = '連續 ' + streak + ' 天！<br>你的靜坐習慣已經深深紮根。';
    else if (streak >= 7) msg = '一週以上了！<br>堅持就是力量，繼續加油。';
    else if (streak >= 3) msg = '已經連續 ' + streak + ' 天了！<br>好的開始，繼續保持。';
    document.getElementById('statsMsg').innerHTML = msg;
  }

  function goHome() {
    sessionStorage.setItem('fromMeditation', '1');
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
