<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sahaja Yoga</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; }

  @keyframes pulse    { 0%,100%{opacity:0.5} 50%{opacity:1} }
  @keyframes fadeChar { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn   { from{opacity:0} to{opacity:1} }

  #bg {
    position:fixed; inset:0; z-index:0;
    background-image: url("https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/png/app_first_page.png");
    background-size: cover;
    background-position: center;
  }
  #overlay { position:fixed; inset:0; z-index:1; background:rgba(10,12,8,0.35); }

  /* ── PAGE 1 ── */
  #page1 {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(10,12,8,0.45);
    cursor:pointer; transition:opacity 0.8s;
  }
  #page1.hide { opacity:0; pointer-events:none; }

  #page1 .title {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(22px,6vw,30px);
    color:#F0E8D0; line-height:1.9;
    letter-spacing:0.12em; text-align:center;
    margin-top:-8vh; pointer-events:none;
  }
  #page1 .tap {
    position:fixed; bottom:calc(5% + 175px);
    left:0; right:0;
    display:flex; justify-content:flex-end; padding-right:16px;
    animation:pulse 2s ease-in-out infinite;
    pointer-events:none;
  }
  .btn-cta {
    font-family:"Noto Sans TC",sans-serif; font-size:13px;
    color:rgba(240,232,210,0.85);
    background:rgba(240,232,210,0.12);
    border:1px solid rgba(240,232,210,0.38);
    border-radius:10px;
    padding:6px 14px;
    letter-spacing:0.05em; white-space:nowrap;
    backdrop-filter:blur(8px);
  }

  /* ── PAGE 2 — quote ── */
  #quoteWrap {
    position:fixed; top:47%; left:0; right:0;
    transform:translateY(-50%);
    z-index:5; opacity:0; transition:opacity 1s ease 0.3s;
    pointer-events:none; text-align:center;
    padding:0 clamp(24px,6vw,32px);
  }
  #quoteWrap.show { opacity:1; }

  #quoteText {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(22px,6vw,30px);
    color:#F0E8D0; line-height:1.9; letter-spacing:0.12em;
    text-shadow:0 1px 8px rgba(0,0,0,0.3);
  }
  #quoteText .char {
    opacity:0; display:inline-block;
    animation:fadeChar 0.6s ease forwards;
  }
  #quoteAuthor {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(13px,3.4vw,15px);
    color:rgba(240,232,210,0.75); margin-top:12px;
    letter-spacing:0.15em;
    opacity:0; transition:opacity 1.5s ease;
    text-shadow:0 1px 6px rgba(0,0,0,0.4);
  }

  /* 主要按鈕：進入冥想室 */
  #tapEnter {
    position:fixed; bottom:calc(5% + 175px);
    left:0; right:0; z-index:6;
    display:none;
    justify-content:flex-end; padding-right:16px;
    animation:pulse 2.5s ease-in-out infinite;
    cursor:pointer;
  }
  #tapEnter.show { display:flex; }

  /* 次要按鈕區：功能選單（比主按鈕小、低調） */
  #menuBtn {
    position:fixed; bottom:5%;
    left:50%; transform:translateX(-50%);
    z-index:6; display:none;
    opacity:0; animation:fadeIn .6s ease .4s forwards;
  }
  .btn-sub {
    padding:9px 28px;
    border-radius:999px;
    background:rgba(240,232,210,0.10);
    backdrop-filter:blur(12px);
    border:0.5px solid rgba(240,232,210,0.28);
    color:rgba(240,232,210,0.60);           /* 明顯比主按鈕淡 */
    font-family:"Noto Serif TC",serif;
    font-size:clamp(12px,3.2vw,14px);      /* 比主按鈕小一號 */
    font-weight:400;
    letter-spacing:0.1em;
    cursor:pointer;
    transition:background .2s, color .2s, transform .1s;
  }
  .btn-sub:active {
    transform:scale(0.96);
    background:rgba(240,232,210,0.18);
    color:rgba(240,232,210,0.85);
  }

  /* ── 音效按鈕 ── */
  #soundBtn {
    position:fixed; bottom:8%; right:18px; z-index:20;
    width:34px; height:34px; border-radius:50%;
    background:rgba(230,220,200,0.55); backdrop-filter:blur(6px);
    border:0.5px solid rgba(255,255,255,0.4);
    display:none; align-items:center; justify-content:center; /* flex，不用 block */
    cursor:pointer; font-size:17px;
  }
  #soundBtn.show { display:flex; }   /* ← bug 修正：一律用 flex */
</style>
</head>
<body>
<div id="bg"></div>
<div id="overlay"></div>

<audio id="bgMusic" loop preload="none">
  <source src="https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/audio/backgroup_music.mp3" type="audio/mp3">
</audio>

<!-- 第一頁 -->
<div id="page1" onclick="startApp()">
  <div class="title">歡迎你的到來<br>這是一趟向內的旅程</div>
  <div class="tap"><span class="btn-cta">輕觸開始旅程 »</span></div>
</div>

<!-- 第二頁 -->
<div id="quoteWrap">
  <div id="quoteText"></div>
  <div id="quoteAuthor">— Shri Mataji</div>
</div>

<!-- 主要 CTA：進入冥想室 -->
<div id="tapEnter" onclick="enterMeditation()"><span class="btn-cta">輕觸進入冥想室 »</span></div>

<!-- 次要 CTA：功能選單（視覺上比主按鈕退後一步） -->
<div id="menuBtn"><button class="btn-sub" onclick="openMenu()">功能選單</button></div>

<!-- 音效切換 -->
<div id="soundBtn" onclick="toggleSound()">🔊</div>

<script>
const audio    = document.getElementById("bgMusic");
const soundBtn = document.getElementById("soundBtn");
let muted  = false;
let started = false;

function showPage2() {
  document.getElementById("quoteWrap").classList.add("show");
  document.getElementById("tapEnter").classList.add("show");
  document.getElementById("menuBtn").style.display   = "flex";   // ← 修正：flex
  soundBtn.classList.add("show");
  startQuotes();
}

// 從靜坐結束回來，直接跳過進入畫面
if (sessionStorage.getItem('fromMeditation') === '1') {
  sessionStorage.removeItem('fromMeditation');
  started = true;
  audio.volume = 0.5;
  audio.play().catch(() => {});
  document.getElementById("page1").classList.add("hide");
  setTimeout(showPage2, 300);
}

function startApp() {
  if (started) return;
  started = true;
  audio.volume = 0.5;
  audio.play().catch(() => {});
  document.getElementById("page1").classList.add("hide");
  setTimeout(showPage2, 600);
}

function toggleSound() {
  muted = !muted;
  audio.muted = muted;
  soundBtn.textContent = muted ? "🔇" : "🔊";
}

/* ── quotes ── */
let quotes = [], current = 0;
const textEl   = document.getElementById("quoteText");
const authorEl = document.getElementById("quoteAuthor");

fetch("https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/quotes.json?t=" + Date.now())
  .then(r => r.json())
  .then(data => { quotes = data; quotes.sort(() => Math.random() - 0.5); })
  .catch(() => {
    quotes = [
      { zh:"真正的靜默，",  zh2:"是思想的靜止。", author:"Shri Mataji" },
      { zh:"靜坐不是努力，", zh2:"而是放下努力。", author:"Shri Mataji" }
    ];
  });

function renderChars(el, line1, line2, delay) {
  el.innerHTML = "";
  line1.split("").forEach((ch, i) => {
    const s = document.createElement("span");
    s.className = "char"; s.textContent = ch;
    s.style.animationDelay = (delay + i * 0.12) + "s";
    el.appendChild(s);
  });
  if (line2) {
    el.appendChild(document.createElement("br"));
    line2.split("").forEach((ch, i) => {
      const s = document.createElement("span");
      s.className = "char"; s.textContent = ch;
      s.style.animationDelay = (delay + (line1.length + i) * 0.12) + "s";
      el.appendChild(s);
    });
  }
}

function showQuote(idx) {
  if (!quotes.length) return;
  textEl.style.opacity   = "0";
  authorEl.style.opacity = "0";
  setTimeout(() => {
    const q = quotes[idx];
    textEl.style.opacity = "1";
    renderChars(textEl, q.zh, q.zh2 || "", 0);
    authorEl.textContent = "— " + q.author;
    const totalChars = q.zh.length + (q.zh2 ? q.zh2.length : 0);
    setTimeout(() => { authorEl.style.opacity = "1"; }, totalChars * 120 + 400);
  }, 900);
}

function startQuotes() {
  const go = () => {
    if (!quotes.length) { setTimeout(go, 300); return; }
    const q = quotes[0];
    renderChars(textEl, q.zh, q.zh2 || "", 0.3);
    authorEl.textContent = "— " + q.author;
    const totalChars = q.zh.length + (q.zh2 ? q.zh2.length : 0);
    setTimeout(() => { authorEl.style.opacity = "1"; }, totalChars * 120 + 700);
    setInterval(() => { current = (current + 1) % quotes.length; showQuote(current); }, 8000);
  };
  go();
}

function enterMeditation() { window.location.href = 'meditation_room.html'; }
function openMenu()        { window.location.href = 'menu.html'; }
</script>
</body>
</html>
