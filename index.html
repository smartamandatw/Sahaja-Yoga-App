<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#1a2e1a;height:100vh;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="test()">
  <div style="color:white;font-size:24px;text-align:center;">
    點這裡測試<br>
    <span id="msg" style="font-size:16px;opacity:0.7;">等待點擊...</span>
  </div>
  <audio id="a" loop>
    <source src="https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/piano-violin-and-vocal.mp3">
  </audio>
  <script>
    function test() {
      document.getElementById('msg').textContent = '點擊成功！嘗試播放音樂...';
      document.getElementById('a').play()
        .then(() => document.getElementById('msg').textContent = '✅ 音樂播放成功！')
        .catch(e => document.getElementById('msg').textContent = '❌ 錯誤: ' + e.message);
    }
  </script>
</body>
</html>
