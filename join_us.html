<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>加入我們</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #F0E8D0;
  --text:     #1C1A17;
  --gold:     #C9A84C;
  --gold-dim: rgba(201,168,76,0.22);
  --muted:    #7a6e5f;
  --card:     rgba(255,255,255,0.72);
  --card-b:   rgba(201,168,76,0.20);
  --soft:     rgba(201,168,76,0.10);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body {
  width:100%; min-height:100%;
  font-family:"Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--text);
  background-image: url("https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/png/app_back_ground.png");
  background-size: cover;
  background-position: center;
  overflow-x:hidden;
}
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse at 15% 0%,   rgba(201,168,76,.12) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(201,168,76,.09) 0%, transparent 55%);
}

/* ── TOP NAV ── */
.top-nav {
  position:sticky; top:0; z-index:20;
  background:rgba(240,232,208,.94);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--gold-dim);
  padding:14px 16px 12px;
  display:flex; align-items:center; gap:12px;
}
.back-btn {
  font-family:"Noto Sans TC",sans-serif; font-size:13px;
  color:var(--muted); background:var(--soft);
  border:1px solid var(--gold); border-radius:10px;
  padding:6px 12px; cursor:pointer;
  transition:background .2s,color .2s; white-space:nowrap;
}
.back-btn:active { background:var(--gold-dim); color:var(--text); }
.nav-title {
  font-family:"Noto Serif TC",serif;
  font-size:clamp(14px,3.8vw,16px);
  color:var(--text); letter-spacing:.1em;
}

/* ── HERO ── */
.hero {
  padding:32px 22px 22px; text-align:center;
  position:relative; z-index:1;
  animation:fadeUp .6s ease both;
}
.hero-tag {
  display:inline-block; background:var(--soft); color:var(--gold);
  font-size:11px; letter-spacing:3px; padding:4px 14px;
  border-radius:20px; margin-bottom:14px; border:1px solid var(--gold-dim);
}
.hero h1 {
  font-family:"Noto Serif TC",serif;
  font-size:clamp(1.5rem,5vw,1.9rem);
  font-weight:700; color:var(--text); line-height:1.4; margin-bottom:10px;
}
.hero h1 em { font-style:normal; color:var(--gold); }
.hero-desc {
  font-size:13.5px; color:var(--muted); line-height:1.9;
  max-width:300px; margin:0 auto;
}

/* ── CARDS ── */
.cards {
  position:relative; z-index:1;
  display:flex; flex-direction:column; gap:10px;
  padding:0 16px; margin-bottom:48px;
}

.acc-card {
  background:var(--card); border-radius:20px;
  border:1px solid var(--card-b); overflow:hidden;
  backdrop-filter:blur(8px);
  transition:box-shadow .25s;
  opacity:0; animation:fadeUp .5s ease both;
}
.acc-card:nth-child(1){animation-delay:.08s}
.acc-card:nth-child(2){animation-delay:.16s}
.acc-card:nth-child(3){animation-delay:.24s}
.acc-card.open {
  box-shadow:0 6px 28px rgba(201,168,76,.14);
  border-color:var(--gold-dim);
}

.acc-header {
  display:flex; align-items:center; gap:14px; padding:18px;
  cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
}
.acc-icon {
  width:44px; height:44px; border-radius:14px; flex-shrink:0;
  background:var(--soft); border:1px solid var(--gold-dim);
  display:flex; align-items:center; justify-content:center; font-size:20px;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.acc-card.open .acc-icon { transform:scale(1.1) rotate(-5deg); }
.acc-titles { flex:1; min-width:0; }
.acc-zh {
  font-family:"Noto Serif TC",serif; font-size:1rem; font-weight:700;
  color:var(--text); line-height:1.2;
}
.acc-sub { font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4; }
.acc-arrow {
  font-size:13px; color:var(--muted); flex-shrink:0;
  transition:transform .3s, color .2s;
}
.acc-card.open .acc-arrow { transform:rotate(90deg); color:var(--gold); }

.acc-body {
  max-height:0; overflow:hidden;
  transition:max-height .48s cubic-bezier(.4,0,.2,1), opacity .32s;
  opacity:0;
}
.acc-card.open .acc-body { max-height:900px; opacity:1; }
.acc-body-inner { padding:0 18px 20px; }

/* ── CONTENT TYPES ── */
.c-intro {
  font-family:"Noto Serif TC",serif;
  font-size:clamp(14px,3.8vw,15.5px); color:var(--text);
  line-height:2; letter-spacing:.04em; margin-bottom:14px;
}

.c-paragraph {
  margin-bottom:10px; padding:14px 16px; border-radius:14px;
  background:rgba(255,255,255,.6); border:1px solid var(--gold-dim);
}
.c-paragraph h3 {
  font-family:"Noto Serif TC",serif; font-size:13.5px;
  color:var(--text); margin-bottom:6px;
  display:flex; align-items:flex-start; gap:7px;
}
.c-paragraph h3::before {
  content:''; display:inline-block; width:3px; min-height:14px;
  background:var(--gold); border-radius:2px; flex-shrink:0; margin-top:3px;
}
.c-paragraph p { font-size:13px; color:var(--muted); line-height:1.9; }

/* ── LINK BUTTONS ── */
.c-links { display:flex; flex-direction:column; gap:8px; }

.c-link-btn {
  display:flex; align-items:center; gap:13px;
  padding:13px 15px; border-radius:14px;
  background:rgba(255,255,255,.6); border:1px solid var(--gold-dim);
  text-decoration:none; cursor:pointer;
  transition:background .2s, transform .15s;
  -webkit-tap-highlight-color:transparent;
}
.c-link-btn:active { background:var(--gold-dim); transform:scale(.98); }

.c-link-icon {
  width:38px; height:38px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:18px;
  border:1px solid var(--gold-dim);
}
.c-link-info { flex:1; min-width:0; }
.c-link-info h4 {
  font-family:"Noto Serif TC",serif; font-size:13.5px;
  color:var(--text); margin-bottom:2px; line-height:1.3;
}
.c-link-info p {
  font-size:11.5px; color:var(--muted); line-height:1.4;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.c-link-arrow { font-size:15px; color:var(--gold); flex-shrink:0; }

/* link icon bg colours */
.c-link-btn[data-platform="line"]     .c-link-icon { background:var(--soft); color:var(--gold); }
.c-link-btn[data-platform="facebook"] .c-link-icon { background:var(--soft); color:var(--gold); }
.c-link-btn[data-platform="youtube"]  .c-link-icon { background:var(--soft); color:var(--gold); }
.c-link-btn[data-platform="threads"]  .c-link-icon { background:var(--soft); color:var(--gold); }
.c-link-btn[data-platform="web"]      .c-link-icon { background:var(--soft); color:var(--gold); }
.c-link-btn[data-platform="email"]    .c-link-icon { background:var(--soft); color:var(--gold); }

/* ── FOOTER ── */
.footer-note {
  position:relative; z-index:1;
  margin:0 16px 48px;
  background:var(--card); border-radius:20px;
  border:1px solid var(--card-b); padding:22px 22px;
  backdrop-filter:blur(8px); text-align:center;
  animation:fadeUp .5s .3s ease both; opacity:0; animation-fill-mode:forwards;
}
.footer-note p {
  font-family:"Noto Serif TC",serif; font-size:13px;
  color:var(--muted); line-height:2;
}
.footer-note em { font-style:normal; color:var(--gold); }

/* ── SCROLL HINT ── */
.scroll-hint {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  z-index:30; pointer-events:none;
  width:40px; height:40px; border-radius:50%;
  background:rgba(240,232,208,.85);
  border:1.5px solid var(--gold);
  backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--gold);
  opacity:0; transition:opacity .4s;
  animation:scrollBounce 1.6s ease-in-out infinite;
}
.scroll-hint.visible { opacity:1; pointer-events:auto; }

@keyframes scrollBounce {
  0%,100% { transform:translateX(-50%) translateY(0); }
  50%      { transform:translateX(-50%) translateY(5px); }
}

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<button class="back-btn" style="position:sticky;top:16px;margin:16px 0 0 16px;z-index:20;display:inline-block;" onclick="goBack()">← 返回</button>

<div class="hero">

  <h1>一個人靜靜地很好<br><em>有人相伴也是好的</em></h1>
  <span class="hero-tag">無論你是想深入了解，還是想解決心裡的問號 · 我們在這裡</span>
</div>

<div class="cards" id="cards"></div>

<div class="footer-note">
  <p>Sahaja Yoga 在全球超過 100 個國家都有練習者</p>
</div>

<div class="scroll-hint" id="scrollHint">&#8964;</div>

<script>
const BASE = 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/';

function getPlatform(url) {
  if (url.includes('line.me'))       return 'line';
  if (url.includes('facebook.com'))  return 'facebook';
  if (url.includes('youtube.com'))   return 'youtube';
  if (url.includes('threads.com'))   return 'threads';
  if (url.startsWith('mailto'))      return 'email';
  return 'web';
}

function getPlatformIcon(platform) {
  const map = {
    line:     '✧',
    facebook: '✧',
    youtube:  '✧',
    threads:  '✧',
    email:    '✧',
    web:      '✧',
  };
  return map[platform] || '✧';
}

let openIdx = -1;

function toggleCard(i) {
  const cards = document.querySelectorAll('.acc-card');
  if (openIdx === i) {
    cards[i].classList.remove('open');
    openIdx = -1;
  } else {
    if (openIdx >= 0) cards[openIdx].classList.remove('open');
    cards[i].classList.add('open');
    openIdx = i;
    setTimeout(() => cards[i].scrollIntoView({ behavior:'smooth', block:'nearest' }), 60);
  }
}

function renderSections(tab) {
  let html = '';
  let linkBuffer = [];

  function flushLinks() {
    if (!linkBuffer.length) return;
    html += `<div class="c-links">`;
    linkBuffer.forEach(s => {
      const platform = getPlatform(s.url);
      const icon = getPlatformIcon(platform);
      html += `<a class="c-link-btn" data-platform="${platform}" href="${s.url}" target="_blank" rel="noopener">
        <div class="c-link-icon">${icon}</div>
        <div class="c-link-info">
          <h4>${s.title}</h4>
          <p>${s.desc}</p>
        </div>
        <span class="c-link-arrow">›</span>
      </a>`;
    });
    html += `</div>`;
    linkBuffer = [];
  }

  if (tab.sections) {
    tab.sections.forEach(s => {
      if (s.type === 'link') {
        linkBuffer.push(s);
      } else {
        flushLinks();
        if (s.type === 'intro') {
          html += `<p class="c-intro">${s.text}</p>`;
        } else if (s.type === 'paragraph') {
          html += `<div class="c-paragraph"><h3>${s.title}</h3><p>${s.text}</p></div>`;
        }
      }
    });
    flushLinks();
  }
  return html;
}

function renderCards(tabs) {
  document.getElementById('cards').innerHTML = tabs.map((tab, i) => `
    <div class="acc-card" id="card-${i}">
      <div class="acc-header" onclick="toggleCard(${i})">
        <div class="acc-icon">${tab.icon}</div>
        <div class="acc-titles">
          <div class="acc-zh">${tab.label}</div>
          <div class="acc-sub">${tab.sub || ''}</div>
        </div>
        <span class="acc-arrow">▶</span>
      </div>
      <div class="acc-body">
        <div class="acc-body-inner">${renderSections(tab)}</div>
      </div>
    </div>
  `).join('');
}

function goBack() {
  if (document.referrer) history.back();
  else window.location.href = 'menu.html';
}

// ── scroll hint ──
const scrollHint = document.getElementById('scrollHint');
function updateScrollHint() {
  const scrollable = document.documentElement.scrollHeight > window.innerHeight + 40;
  const nearBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 60;
  if (scrollable && !nearBottom) {
    scrollHint.classList.add('visible');
  } else {
    scrollHint.classList.remove('visible');
  }
}
window.addEventListener('scroll', updateScrollHint, { passive:true });
window.addEventListener('resize', updateScrollHint);
// check after content loads
setTimeout(updateScrollHint, 600);

fetch(BASE + 'join_us.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => { renderCards(data.tabs); setTimeout(updateScrollHint, 200); })
  .catch(() => {
    document.getElementById('cards').innerHTML =
      '<p style="color:var(--muted);padding:40px 24px;text-align:center;font-family:\'Noto Serif TC\',serif;">內容載入失敗，請稍後再試。</p>';
  });
</script>
</body>
</html>
