<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sahaja Yoga</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #F0E8D0;
  --text:     #1C1A17;
  --gold:     #C9A84C;
  --gold-dim: rgba(201,168,76,0.22);
  --muted:    #7a6e5f;
  --card:     rgba(255,255,255,0.72);
  --card-b:   rgba(201,168,76,0.20);
  --soft:     rgba(201,168,76,0.10);
  --bg-hint:      rgba(240,232,208,0.85); /* scroll hint 背景 */
}

  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"Noto Sans TC",sans-serif; }
  @keyframes fadeChar { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }
  /* ── SCROLL HINT ── */
.scroll-hint{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:30;pointer-events:none;
  width:40px;height:40px;border-radius:50%;
  background:var(--bg-hint);
  border:1.5px solid var(--gold);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--gold);
  opacity:0;transition:opacity .4s;
  animation:scrollBounce 1.6s ease-in-out infinite;
}
.scroll-hint.visible{opacity:1;pointer-events:auto;}
@keyframes scrollBounce{
  0%,100%{transform:translateX(-50%) translateY(0);}
  50%{transform:translateX(-50%) translateY(5px);}
}

@keyframes fadeUp { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:translateY(0);} }

  #bg {
    position:fixed; inset:0; z-index:0;
    background-size:cover; background-position:center;
    transition:background-image 0.6s ease;
  }
  #overlay {
    position:fixed; inset:0; z-index:1;
    background:rgba(10,12,8,0.5);
    transition:background 0.5s;
  }

  /* ── 選擇頁 ── */
  #selectPage {
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding:0; overflow-y:auto; overflow-x:hidden;
    opacity:1; pointer-events:auto;
    transition:opacity 0.5s ease;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #selectPage::-webkit-scrollbar { display:none; }
  #selectPage.hide { opacity:0; pointer-events:none; }

  /* ── TOP NAV ── */
  .top-nav {
    position:sticky; top:0; z-index:20;
    width:100%;
    background:rgba(240,232,208,.94);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--gold-dim);
    padding:14px 16px 12px;
    display:flex; align-items:center; gap:12px;
    flex-shrink:0;
  }
  .back-btn {
  font-family:"Noto Sans TC",sans-serif; font-size:13px;
  color:var(--muted); background:var(--soft);
  border:1px solid var(--gold); border-radius:10px;
  padding:6px 12px; cursor:pointer;
  transition:background .2s,color .2s; white-space:nowrap;
}
.back-btn:active { background:var(--gold-dim); color:var(--text); }
  .nav-title {
    font-family:"Noto Serif TC",serif; font-size:clamp(14px,3.8vw,16px);
    color:var(--text); letter-spacing:.1em;
  }

  /* ── HERO ── */
  .hero {
    padding:28px 22px 16px; text-align:center;
    position:relative; z-index:1; width:100%;
    animation:fadeUp .6s ease both;
    flex-shrink:0;
  }
  .hero-tag {
    display:inline-block; background:var(--bg); color:var(--text:);
    font-size:11px; letter-spacing:3px; padding:4px 14px;
    border-radius:20px; margin-bottom:12px; border:1px solid var(--gold-dim);
  }
  .hero h1 {
    font-family:"Noto Serif TC",serif; font-size:clamp(1.3rem,4.5vw,1.7rem);
    font-weight:700; color:var(--text); line-height:1.4; margin-bottom:8px;
  }
  .hero h1 em { font-style:normal; color:var(--gold); }
  .hero-desc {
    font-size:13px; color:var(--muted); line-height:1.8;
    max-width:300px; margin:0 auto;
  }

  /* ── ACCORDION CARDS ── */
  .acc-cards {
    position:relative; z-index:1;
    display:flex; flex-direction:column; gap:10px;
    padding:0 16px; width:100%;
    flex-shrink:0;
  }

  .acc-card {
    background:var(--card); border-radius:20px;
    border:1px solid var(--card-b); overflow:hidden;
    backdrop-filter:blur(8px);
    transition:box-shadow .25s;
    opacity:0; animation:fadeUp .5s ease both;
  }
  .acc-card:nth-child(1){animation-delay:.1s;}
  .acc-card:nth-child(2){animation-delay:.18s;}
  .acc-card.open {
    box-shadow:0 6px 28px rgba(201,168,76,.14);
    border-color:var(--gold-dim);
  }

  /* card header */
  .acc-header {
    display:flex; align-items:center; gap:14px;
    padding:18px 18px; cursor:pointer;
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .acc-icon {
    width:44px; height:44px; border-radius:14px;
    background:var(--soft); border:1px solid var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .acc-card.open .acc-icon { transform:scale(1.1) rotate(-5deg); }
  .acc-titles { flex:1; }
  .acc-zh {
    font-family:"Noto Serif TC",serif; font-size:1rem; font-weight:700;
    color:var(--text); line-height:1.2;
  }
  .acc-sub { font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:.5px; }
  .acc-arrow {
    font-size:13px; color:var(--muted);
    transition:transform .3s, color .2s; flex-shrink:0;
  }
  .acc-card.open .acc-arrow { transform:rotate(90deg); color:var(--gold); }

  /* card body */
  .acc-body {
    max-height:0; overflow:hidden;
    transition:max-height .48s cubic-bezier(.4,0,.2,1), opacity .32s;
    opacity:0;
  }
  .acc-card.open .acc-body { max-height:1200px; opacity:1; }
  .acc-body-inner { padding:0 14px 16px; display:flex; flex-direction:column; gap:7px; }

  /* ── item buttons inside accordion ── */
  .item-btn {
    padding:12px 14px; border-radius:14px;
    border:1px solid var(--gold-dim);
    background:rgba(255,255,255,0.6);
    color:var(--text);
    font-family:"Noto Serif TC",serif;
    font-size:clamp(13px,3.5vw,15px); letter-spacing:0.06em;
    cursor:pointer; text-align:left; line-height:1.4;
    transition:background 0.2s, border-color 0.2s, transform 0.1s;
    flex-shrink:0;
  }
  .item-btn .btn-label {
    display:block;
    font-size:clamp(13px,3.5vw,15px);
    color:var(--text);
    letter-spacing:0.08em;
    margin-bottom:4px;
  }
  .item-btn .btn-desc {
    display:block;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.04em;
    line-height:1.6;
    margin-bottom:4px;
  }
  .item-btn .btn-duration {
    display:inline-block;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.06em;
    border:0.5px solid var(--gold-dim);
    border-radius:20px;
    padding:1px 8px;
  }
  .item-btn:active { transform:scale(0.97); }
  .item-btn.selected {
    background:var(--gold-dim);
    border-color:var(--gold);
    color:var(--text);
  }
  .item-btn.selected .btn-label { color:var(--text); font-weight:700; }
  .item-btn.selected .btn-desc  { color:var(--muted); }
  .item-btn.selected .btn-duration { border-color:var(--gold); }

  /* selected indicator */
  .acc-selected-tag {
    display:inline-block; font-size:10px; color:var(--gold);
    background:var(--soft); border:1px solid var(--gold-dim);
    border-radius:999px; padding:1px 8px; margin-left:6px;
    vertical-align:middle; letter-spacing:.04em;
  }

  /* 開始按鈕 */
  .start-wrap {
    width:100%;
    padding:clamp(10px,2.5vh,16px) 16px clamp(12px,3vh,80px);
    display:flex; justify-content:center;
    flex-shrink:0;
  }
  
  .start-btn {
    width:180px;
    padding:10px 30px;
    border-radius:999px;
    background:rgba(210,200,178,0.65);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.5);
    color:#1C1609;
    font-family:"Noto Serif TC",serif; font-size:14px;
    font-weight:400;
    letter-spacing:0.1em;
    cursor:pointer;
    transition:transform 0.1s;
}

  .start-btn:active { transform:scale(0.97); }


  /* ── 靜坐畫面 ── */
  #meditationPage {
    position:fixed; inset:0; z-index:5;
    opacity:0; pointer-events:none;
    transition:opacity 0.8s ease;
  }
  #meditationPage.show { opacity:1; pointer-events:auto; }

  #timer {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(16px,4.5vw,20px);
    color:rgba(240,232,210,0.55); letter-spacing:0.2em;
    pointer-events:none; text-align:center;
    margin-top:16px;
  }

  #tipWrap {
    position:fixed; top:68%; left:0; right:0; z-index:6;
    display:flex; flex-direction:column; align-items:center; gap:20px;
    padding:0 clamp(24px,7vw,48px); pointer-events:none;
  }
  #tipText {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(16px,4.5vw,20px);
    color:rgba(240,232,210,0.8); line-height:2; letter-spacing:0.15em;
    text-align:center; text-shadow:0 1px 8px rgba(0,0,0,0.5);
  }
  #tipText .char { opacity:0; display:inline-block; animation:fadeChar 0.5s ease forwards; }

  #tapLayer { position:fixed; inset:0; z-index:15; cursor:pointer; display:none; }
  #tapLayer.show { display:block; }

  #pauseOverlay {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding-bottom:6vh; gap:16px;
    background:rgba(10,12,8,0.6);
    opacity:0; pointer-events:none; transition:opacity 0.3s;
  }
  #pauseOverlay.show { opacity:1; pointer-events:auto; }

.pause-btn {
    width:180px;
    padding:10px 30px;
    border-radius:999px;
    background:rgba(210,200,178,0.65);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.5);
    color:#1C1609;
    font-family:"Noto Serif TC",serif; font-size:14px;
    font-weight:400;
    letter-spacing:0.1em;
    cursor:pointer;
    transition:transform 0.1s;
}

  .pause-btn:active { transform:scale(0.97); }

.end-btn {
    width:180px;
    padding:10px 30px;
    border-radius:999px;
    background:rgba(150,140,120,0.55);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.4);
    color:rgba(240,232,210,0.95);
    font-family:"Noto Serif TC",serif; font-size:14px;
    font-weight:400;
    letter-spacing:0.1em;
    cursor:pointer;
    transition:transform 0.1s;
}
  .end-btn:active { transform:scale(0.97); }

#controlBar{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  display:flex;
  gap:12px;
  align-items:center;
}

  #backToSelect {
    position:fixed; top:16px; left:16px; z-index:25;
    font-family:"Noto Sans TC",sans-serif; font-size:13px;
    color:var(--muted); background:var(--soft);
    border:1px solid var(--gold-dim); border-radius:10px;
    padding:6px 12px; cursor:pointer;
    transition:background .2s, color .2s;
    letter-spacing:0.05em;
  }
  #backToSelect:active { background:var(--gold-dim); color:var(--text); }



  /* ── 靜坐中背景切換列 ── */
  #bgSwitcherWrap {
    position:fixed; bottom:90px; left:0; right:0; z-index:10;
    opacity:0; pointer-events:none;
    transition:opacity 0.4s ease;
  }
  #bgSwitcherWrap.show { opacity:1; pointer-events:auto; }
  /* 右側漸層提示可繼續滑動 */
  #bgSwitcherWrap::after {
    content:'';
    position:absolute; top:0; right:0; bottom:0;
    width:40px; pointer-events:none;
    background:linear-gradient(to right, transparent, rgba(10,12,8,0.65));
  }
  #bgSwitcher {
    display:flex; align-items:center;
    gap:8px; padding:0 16px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #bgSwitcher::-webkit-scrollbar { display:none; }
  .bg-thumb {
    width:44px; height:33px; border-radius:6px;
    background-size:cover; background-position:center;
    border:2px solid transparent;
    cursor:pointer;
    transition:border-color 0.2s, transform 0.15s;
    flex-shrink:0;
  }
  .bg-thumb:active { transform:scale(0.9); }
  .bg-thumb.selected { border-color:rgba(240,232,210,0.9); }


  /* ── Accordion 內部向下箭頭提示 ── */
  .acc-scroll-hint {
    display:none;
    align-items:center; justify-content:center;
    padding:4px 0 10px;
    transition:opacity .4s;
  }
  .acc-scroll-hint.visible {
    display:flex;
    opacity:1;
  }
  .acc-scroll-arrow {
    width:28px; height:28px; border-radius:50%;
    background:var(--soft); border:1px solid var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--gold);
    animation:scrollBounce 1.6s ease-in-out infinite;
  }

  /* ── 引導「即將推出」狀態 ── */
  .item-btn.locked {
    opacity: 0.5;
    border-color: var(--gold-dim);
    cursor: pointer;
    pointer-events: auto;
    position: relative;
  }
  .badge-soon {
    display: inline-block;
    font-family: "Noto Sans TC", sans-serif;
    font-size: 9px;
    letter-spacing: 0.05em;
    color: var(--muted);
    background: var(--soft);
    border: 0.75px solid var(--gold-dim);
    border-radius: 999px;
    padding: 2px 7px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Toast 提示 */
  #meditationToast {
    position: fixed;
    bottom: 40px;
    left: 50%; transform: translateX(-50%) translateY(20px);
    z-index: 100;
    background: rgba(240,232,208,0.95);
    backdrop-filter: blur(12px);
    border: 1px solid var(--gold-dim);
    border-radius: 999px;
    padding: 12px 28px;
    font-family: "Noto Serif TC", serif;
    font-size: clamp(13px,3.5vw,15px);
    color: var(--muted);
    letter-spacing: 0.12em;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }
  #meditationToast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

</style>
</head>
<body>

<div id="bg"></div>
<div id="overlay"></div>

<!-- 選擇畫面：accordion -->
<div id="selectPage">

  <button class="back-btn" style="position:sticky;top:16px;margin:16px 0 0 16px;z-index:20;align-self:flex-start;" onclick="goHome()">← 返回</button>

  <div class="hero">
    <h1>選擇你的<em>音樂與引導</em></h1>
    <span class="hero-tag">MEDITATION · 開始之前展開 · 每個選項，依心情挑選</span>
  </div>

  <div class="acc-cards">

    <!-- 音樂卡片 -->
    <div class="acc-card" id="musicCard">
      <div class="acc-header" onclick="toggleAcc('musicCard')">
        <div class="acc-icon">🎵</div>
        <div class="acc-titles">
          <div class="acc-zh">背景音樂<span class="acc-selected-tag" id="musicTag" style="display:none"></span></div>
          <div class="acc-sub">選擇冥想時的音樂氛圍</div>
        </div>
        <span class="acc-arrow">▶</span>
      </div>
      <div class="acc-body">
        <div class="acc-body-inner" id="musicList"></div>
      </div>
    </div>
    <div class="acc-scroll-hint" id="musicScrollHint"><div class="acc-scroll-arrow">&#8964;</div></div>

    <!-- 引導卡片 -->
    <div class="acc-card" id="guideCard">
      <div class="acc-header" onclick="toggleAcc('guideCard')">
        <div class="acc-icon">🕊️</div>
        <div class="acc-titles">
          <div class="acc-zh">靜坐引導<span class="acc-selected-tag" id="guideTag" style="display:none"></span></div>
          <div class="acc-sub">選擇今天的冥想內容</div>
        </div>
        <span class="acc-arrow">▶</span>
      </div>
      <div class="acc-body">
        <div class="acc-body-inner" id="guideList"></div>
      </div>
    </div>
    <div class="acc-scroll-hint" id="guideScrollHint"><div class="acc-scroll-arrow">&#8964;</div></div>

  </div>

  <div class="start-wrap">
    <button class="start-btn" id="startBtn" onclick="startMeditation()">開始靜坐 »</button>
  </div>
</div>

<!-- 靜坐畫面 -->
<div id="meditationPage">
  <button id="backToSelect" onclick="backToSelect()">←返回</button>
  <!-- 背景切換縮圖列 -->
  <div id="bgSwitcherWrap">
    <div id="bgSwitcher"></div>
  </div>
  <div id="tipWrap">
    <div id="tipText"></div>
    <div id="timer">00:00</div>
  </div>
  <div id="controlBar">
    <button class="pause-btn" id="pauseBtn" onclick="togglePauseButton()">⏸ 暫停</button>
    <button class="end-btn" onclick="endMeditation()">結束靜坐</button>
  </div>
</div>

<audio id="previewMusic" loop></audio>
<audio id="previewGuide" loop></audio>
<audio id="guideAudio"></audio>
<audio id="bgAudio" loop></audio>

<div id="meditationToast">✦ 即將開放，敬請期待</div>

<div class="scroll-hint" id="scrollHint">&#8964;</div>

<script>
  const BASE = 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/';

  let selBg = null, selBgUrl = null;
  let selMusic = null, selMusicUrl = null;
  let selGuide = null, selGuideUrl = null;

  // ── Accordion 開關 ──
  function toggleAcc(id) {
    const card = document.getElementById(id);
    const isOpen = card.classList.contains('open');
    document.querySelectorAll('.acc-card').forEach(function(c) { c.classList.remove('open'); });
    // 關閉所有箭頭
    document.getElementById('musicScrollHint').classList.remove('visible');
    document.getElementById('guideScrollHint').classList.remove('visible');
    if (!isOpen) {
      card.classList.add('open');
      setTimeout(function() { card.scrollIntoView({ behavior:'smooth', block:'nearest' }); }, 60);
      // 展開後直接顯示對應箭頭
      const hintId = (id === 'musicCard') ? 'musicScrollHint' : 'guideScrollHint';
      setTimeout(function() {
        document.getElementById(hintId).classList.add('visible');
      }, 520);
    }
  }

  function checkReady() {
    const ready = !!(selMusic !== null && selGuide !== null);
    // 兩項都選好後收起所有 accordion
    if (ready) {
      document.querySelectorAll('.acc-card').forEach(function(c) { c.classList.remove('open'); });
    }
  }




  // ── 菜單頁預設背景 ──
  const menuBgUrl = BASE + 'png/app_back_ground.png';
  selBg = 'default';
  selBgUrl = menuBgUrl;
  document.getElementById('bg').style.backgroundImage = "url('" + menuBgUrl + "')";

  // 記錄第一個靜坐背景（進入靜坐時使用）
  let firstBgKey = null, firstBgUrl = null;

  // ── 載入背景場景清單（只建立靜坐中切換縮圖，不覆蓋預設背景）──
  fetch(BASE + 'backgrounds.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      const switcher = document.getElementById('bgSwitcher');
      list.forEach(function(bg, idx) {
        const url = BASE + bg.file;
        // 記住第一個背景
        if (idx === 0) { firstBgKey = bg.key; firstBgUrl = url; }
        // 建立靜坐中縮圖（第一個預設 selected）
        const thumb = document.createElement('div');
        thumb.className = 'bg-thumb' + (idx === 0 ? ' selected' : '');
        thumb.style.backgroundImage = "url('" + url + "')";
        thumb.title = bg.label;
        thumb.addEventListener('click', function() {
          switcher.querySelectorAll('.bg-thumb').forEach(function(t) { t.classList.remove('selected'); });
          thumb.classList.add('selected');
          selBg = bg.key; selBgUrl = url;
          const bgEl = document.getElementById('bg');
          bgEl.classList.add('switching');
          bgEl.style.backgroundImage = "url('" + url + "')";
        });
        switcher.appendChild(thumb);
      });
    })
    .catch(function() {
      console.warn('backgrounds.json 載入失敗，使用預設背景');
    });

  // ── 載入音樂清單 ──
  fetch(BASE + 'music.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      const el = document.getElementById('musicList');
      list.forEach(function(m, idx) {
        const btn = document.createElement('div');
        btn.className = 'item-btn';
        btn.innerHTML = '<span class="btn-label">' + m.label + '</span>';
        btn.addEventListener('click', function() {
          el.querySelectorAll('.item-btn').forEach(function(b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          selMusic = m.key;
          selMusicUrl = m.file ? BASE + m.file : '';
          // 更新標籤
          const tag = document.getElementById('musicTag');
          tag.textContent = m.label; tag.style.display = '';
          // 試聽
          const pa = document.getElementById('previewMusic');
          pa.pause();
          if (selMusicUrl) { pa.src = selMusicUrl; pa.volume = 0.4; pa.play().catch(function(){}); }
          checkReady();
          document.getElementById('musicScrollHint').classList.remove('visible');
        });
        el.appendChild(btn);
      });
    });

  // ── Toast 提示 ──
  let toastTimer = null;
  function showToast() {
    const t = document.getElementById('meditationToast');
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  // ── 載入引導清單 ──
  fetch(BASE + 'guide.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      const el = document.getElementById('guideList');
      list.forEach(function(g, idx) {
        const btn = document.createElement('div');
        btn.className = 'item-btn';
        const hasFile = !!(g.file && g.file.trim());
        btn.innerHTML =
          '<span class="btn-label">' + g.label +
          (!hasFile ? '<span class="badge-soon">即將開放</span>' : '') +
          '</span>' +
          (g.description ? '<span class="btn-desc">' + g.description + '</span>' : '') +
          (g.duration    ? '<span class="btn-duration">⏱ ' + g.duration + '</span>' : '');
        if (!hasFile) {
          btn.classList.add('locked');
          btn.addEventListener('click', function() { showToast(); });
        } else {
          btn.addEventListener('click', function() {
            el.querySelectorAll('.item-btn').forEach(function(b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
            selGuide = g.key;
            selGuideUrl = BASE + g.file;
            // 更新標籤
            const tag = document.getElementById('guideTag');
            tag.textContent = g.label; tag.style.display = '';
            const pa = document.getElementById('previewGuide');
            pa.pause();
            pa.src = selGuideUrl; pa.volume = 0.4; pa.play().catch(function(){});
            checkReady();
            document.getElementById('guideScrollHint').classList.remove('visible');
          });
        }
        el.appendChild(btn);
      });
    });

  // ── 返回選擇畫面 ──
  function goHome(){
    sessionStorage.setItem('fromMeditation', '1');
    window.location.href = 'index.html';
  }

  // ── 返回選擇畫面 ──
  function backToSelect() {
    document.getElementById('guideAudio').pause();
    document.getElementById('bgAudio').pause();
    document.getElementById('previewMusic').pause();
    document.getElementById('previewGuide').pause();
    clearInterval(timerInterval);
    seconds = 0; paused = false;
    const pb=document.getElementById('pauseBtn'); if(pb) pb.innerHTML='⏸ 暫停';
    document.getElementById('timer').textContent = '00:00';
    document.getElementById('tipText').innerHTML = '';
    document.getElementById('bgSwitcherWrap').classList.remove('show');
    document.getElementById('meditationPage').classList.remove('show');
    document.getElementById('selectPage').classList.remove('hide');
    document.getElementById('overlay').style.background = 'rgba(10,12,8,0.5)';
    // 還原菜單預設背景
    selBg = 'default'; selBgUrl = menuBgUrl;
    document.getElementById('bg').style.backgroundImage = "url('" + menuBgUrl + "')";
  }

  // ── 開始靜坐 ──
  function startMeditation() {
    paused = false;
    const pb=document.getElementById('pauseBtn'); if(pb) pb.innerHTML='⏸ 暫停';
    document.getElementById('previewMusic').pause();
    document.getElementById('previewGuide').pause();
    document.getElementById('selectPage').classList.add('hide');
    document.getElementById('overlay').style.background = 'rgba(10,12,8,0.5)';

    // 切換到第一個靜坐背景
    if (firstBgUrl) {
      selBg = firstBgKey; selBgUrl = firstBgUrl;
      document.getElementById('bg').style.backgroundImage = "url('" + firstBgUrl + "')";
      // 重置縮圖 selected 狀態回第一個
      const switcher = document.getElementById('bgSwitcher');
      switcher.querySelectorAll('.bg-thumb').forEach(function(t, i) {
        t.classList.toggle('selected', i === 0);
      });
    }

    const guideAudio = document.getElementById('guideAudio');
    const bgAudio = document.getElementById('bgAudio');

    if (selGuideUrl) {
      guideAudio.src = selGuideUrl;
      guideAudio.volume = 1.0;
      guideAudio.play().catch(function(e) { console.log(e); });
    }
    if (selMusicUrl) {
      bgAudio.src = selMusicUrl;
      bgAudio.volume = 0.02;
      bgAudio.play().catch(function(e) { console.log(e); });
    }

    document.getElementById('meditationPage').classList.add('show');
    document.getElementById('bgSwitcherWrap').classList.add('show');

    startTimer();
    loadTips();

    guideAudio.addEventListener('ended', function() {
      if (seconds >= 60) endMeditation();
    });
  }

  // ── 計時器 ──
  let seconds = 0, paused = false, timerInterval = null;

  function startTimer() {
    timerInterval = setInterval(function() {
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      document.getElementById('timer').textContent = m + ':' + s;
    }, 1000);
  }

  // ── 靜心提示語 ──
  let tips = [], tipIndex = 0;

  function loadTips() {
    fetch(BASE + 'tips.json?t=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(list) {
        tips = list.sort(function() { return Math.random()-0.5; });
        showTip(0);
        setInterval(function() {
          tipIndex = (tipIndex+1) % tips.length;
          showTip(tipIndex);
        }, 30000);
      })
      .catch(function() {
        tips = [{ text:'讓思想安靜下來，只是觀察。' }];
        showTip(0);
      });
  }

  function showTip(idx) {
    const tipEl = document.getElementById('tipText');
    tipEl.style.transition = 'opacity 1s ease';
    tipEl.style.opacity = '0';
    setTimeout(function() {
      tipEl.innerHTML = '';
      tipEl.style.opacity = '1';
      tips[idx].text.split('').forEach(function(ch, i) {
        const span = document.createElement('span');
        span.className = 'char'; span.textContent = ch;
        span.style.animationDelay = (i * 0.1) + 's';
        tipEl.appendChild(span);
      });
    }, 1000);
  }

  // ── 暫停／繼續 ──
  function togglePauseButton() {

    const btn = document.getElementById('pauseBtn');

    if (!paused) {
      paused = true;
      document.getElementById('guideAudio').pause();
      document.getElementById('bgAudio').pause();
      clearInterval(timerInterval);
      btn.innerHTML = '▶ 繼續';
    } else {
      paused = false;
      document.getElementById('guideAudio').play().catch(function(){});
      if (selMusicUrl) {
        document.getElementById('bgAudio').play().catch(function(){});
      }
      startTimer();
      btn.innerHTML = '⏸ 暫停';
    }
  }


  function endMeditation() {
    document.getElementById('guideAudio').pause();
    document.getElementById('bgAudio').pause();
    clearInterval(timerInterval);

    const today = new Date().toDateString();
    const lastDate = localStorage.getItem('sahaja_last_date');
    let streak = parseInt(localStorage.getItem('sahaja_streak') || '0');
    if (lastDate !== today) {
      const yesterday = new Date(Date.now()-86400000).toDateString();
      streak = (lastDate === yesterday) ? streak+1 : 1;
      localStorage.setItem('sahaja_streak', streak);
      localStorage.setItem('sahaja_last_date', today);
    }
    localStorage.setItem('sahaja_last_duration', seconds);

    window.location.href = 'feedback.html';
  }

// ── scroll hint ──
const scrollHint = document.getElementById('scrollHint');
function updateScrollHint() {
  const scrollable = document.body.scrollHeight > window.innerHeight + 40;
  const nearBottom = window.scrollY + window.innerHeight >= document.body.scrollHeight - 60;
  scrollHint.classList.toggle('visible', scrollable && !nearBottom);
}
window.addEventListener('scroll', updateScrollHint, { passive:true });
window.addEventListener('resize', updateScrollHint);
setTimeout(updateScrollHint, 600);

</script>
</body>
</html>
