<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sahaja Yoga</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"Noto Sans TC",sans-serif; }
  @keyframes fadeChar { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }

  #bg {
    position:fixed; inset:0; z-index:0;
    background-size:cover; background-position:center;
    transition:background-image 0.6s ease;
  }
  #overlay {
    position:fixed; inset:0; z-index:1;
    background:rgba(10,12,8,0.5);
    transition:background 0.5s;
  }

  /* ── 選擇頁（三欄） ── */
  #selectPage {
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding:0; overflow:hidden;
    opacity:1; pointer-events:auto;
    transition:opacity 0.5s ease;
  }
  #selectPage.hide { opacity:0; pointer-events:none; }

.page-title {
    font-family:"Noto Serif TC",serif;
    font-size:16px;
    color:rgba(240,232,210,0.85);
    letter-spacing:0.2em;
    text-align:center;
    text-shadow:0 1px 8px rgba(0,0,0,0.4);
    flex-shrink:0;
    line-height:1.4;
    padding:12px 0 8px;
}

  /* 三欄主體 */
  .three-col {
    display:flex; flex-direction:row;
    width:100%; flex:1; min-height:0;
    gap:0; overflow:hidden;
  }

  /* 每欄 */
  .col {
    display:flex; flex-direction:column;
    align-items:center; padding:0 6px;
    overflow:hidden; position:relative;
  }
  /* 左欄縮小，中右欄放大 */
  .col:nth-child(1) { flex:1; }
  .col:nth-child(2) { flex:1; }
  .col + .col {
    border-left:1px solid rgba(240,232,210,0.15);
  }

  .col-title {
    font-family:"Noto Serif TC",serif;
    font-size:15px;
    color:rgba(240,232,210,0.55);
    letter-spacing:0.18em; text-align:center;
    margin-bottom:8px; flex-shrink:0;
  }

  /* 可滑動提示：底部漸層遮罩 */
  .scroll-fade {
    position:absolute; bottom:0; left:0; right:0;
    height:40px; pointer-events:none; z-index:2;
    background:linear-gradient(transparent, rgba(10,12,8,0.75));
    opacity:1; transition:opacity 0.3s;
  }
  .scroll-fade.hidden { opacity:0; }

  /* 箭頭小指示器 */
  .scroll-arrow {
    position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    pointer-events:none; z-index:3;
    font-size:25px; color:rgba(240,232,210,0.6);
    letter-spacing:0.05em;
    animation:arrowBob 1.6s ease-in-out infinite;
    opacity:1; transition:opacity 0.3s;
  }
  .scroll-arrow.hidden { opacity:0; }
  @keyframes arrowBob {
    0%,100% { transform:translateX(-50%) translateY(0); }
    50%      { transform:translateX(-50%) translateY(3px); }
  }

  /* 背景場景：直排 */
  .bg-list {
    display:flex; flex-direction:column;
    gap:6px; width:100%;
    overflow-y:auto; flex:1;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:4px;
  }
  .bg-list::-webkit-scrollbar { display:none; }

  .bg-card {
    position:relative; border-radius:8px;
    overflow:hidden; cursor:pointer;
    flex-shrink:0; aspect-ratio:4/3;
    border:2px solid transparent;
    transition:border-color 0.2s, transform 0.15s;
    background:#111;
  }
  .bg-card:active { transform:scale(0.96); }
  .bg-card.selected { border-color:rgba(240,232,210,0.9); }
  .bg-card.selected::after {
    content:"✓"; position:absolute; top:5px; right:7px;
    font-size:12px; color:#F0E8D0;
    text-shadow:0 1px 4px rgba(0,0,0,0.7);
  }
  .bg-img { width:100%; height:100%; background-size:cover; background-position:center; }
  .bg-label {
    position:absolute; bottom:0; left:0; right:0;
    padding:5px 4px;
    background:linear-gradient(transparent,rgba(0,0,0,0.7));
    font-size:clamp(9px,2.4vw,11px);
    color:#F0E8D0; text-align:center; letter-spacing:0.05em;
  }

  /* 音樂／引導：直排列表 */
  .item-list {
    display:flex; flex-direction:column;
    gap:7px; width:100%;
    overflow-y:auto; flex:1;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:4px;
  }
  .item-list::-webkit-scrollbar { display:none; }

  .item-btn {
    padding:11px 8px; border-radius:10px;
    border:0.5px solid rgba(255,255,255,0.18);
    background:rgba(230,220,200,0.75); backdrop-filter:blur(8px);
    color:rgba(240,232,210,0.75);
    font-family:"Noto Serif TC",serif;
    font-size:clamp(15px,4vw,19px); letter-spacing:0.06em;
    cursor:pointer; text-align:left; line-height:1.4;
    transition:background 0.2s, border-color 0.2s, transform 0.1s;
    flex-shrink:0;
  }
  .item-btn .btn-label {
    display:block;
    font-size:clamp(15px,4vw,19px);
    color:rgba(240,232,210,0.9);
    letter-spacing:0.08em;
    margin-bottom:4px;
  }
  .item-btn .btn-desc {
    display:block;
    font-size:clamp(12px,3vw,14px);
    color:rgba(240,232,210,0.5);
    letter-spacing:0.04em;
    line-height:1.5;
    margin-bottom:4px;
  }
  .item-btn .btn-duration {
    display:inline-block;
    font-size:clamp(11px,2.8vw,13px);
    color:rgba(240,232,210,0.4);
    letter-spacing:0.06em;
    border:0.5px solid rgba(240,232,210,0.2);
    border-radius:20px;
    padding:1px 6px;
  }
  .item-btn.selected .btn-label { color:#F0E8D0; }
  .item-btn.selected .btn-desc  { color:rgba(240,232,210,0.65); }
  .item-btn.selected .btn-duration { color:rgba(240,232,210,0.55); border-color:rgba(240,232,210,0.35); }
  .item-btn:active { transform:scale(0.97); }
  .item-btn.selected {
    background:rgba(230,220,200,0.25);
    border-color:rgba(240,232,210,0.65);
    color:#F0E8D0;
  }

  /* 開始按鈕 */
  .start-wrap {
    flex-shrink:0;
    padding:clamp(10px,2.5vh,16px) 0 clamp(12px,3vh,20px);
    opacity:0; pointer-events:none;
    transform:translateY(8px);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  .start-wrap.visible {
    opacity:1; pointer-events:auto;
    transform:translateY(0);
  }
  .start-btn {
    width:180px;
    padding:10px 30px;
    border-radius:999px;
    background:rgba(210,200,178,0.65);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.5);
    color:#1C1609;
    font-family:"Noto Serif TC",serif; font-size:14px;
    font-weight:400;
    letter-spacing:0.1em;
    cursor:pointer;
    transition:transform 0.1s;
}

  .start-btn:active { transform:scale(0.97); }


  /* ── 靜坐畫面 ── */
  #meditationPage {
    position:fixed; inset:0; z-index:5;
    opacity:0; pointer-events:none;
    transition:opacity 0.8s ease;
  }
  #meditationPage.show { opacity:1; pointer-events:auto; }

  #timer {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(16px,4.5vw,20px);
    color:rgba(240,232,210,0.55); letter-spacing:0.2em;
    pointer-events:none; text-align:center;
    margin-top:16px;
  }

  #tipWrap {
    position:fixed; top:68%; left:0; right:0; z-index:6;
    display:flex; flex-direction:column; align-items:center; gap:20px;
    padding:0 clamp(24px,7vw,48px); pointer-events:none;
  }
  #tipText {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(16px,4.5vw,20px);
    color:rgba(240,232,210,0.8); line-height:2; letter-spacing:0.15em;
    text-align:center; text-shadow:0 1px 8px rgba(0,0,0,0.5);
  }
  #tipText .char { opacity:0; display:inline-block; animation:fadeChar 0.5s ease forwards; }

  #tapLayer { position:fixed; inset:0; z-index:15; cursor:pointer; display:none; }
  #tapLayer.show { display:block; }

  #pauseOverlay {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding-bottom:6vh; gap:16px;
    background:rgba(10,12,8,0.6);
    opacity:0; pointer-events:none; transition:opacity 0.3s;
  }
  #pauseOverlay.show { opacity:1; pointer-events:auto; }

.pause-btn {
    width:180px;
    padding:10px 30px;
    border-radius:999px;
    background:rgba(210,200,178,0.65);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.5);
    color:#1C1609;
    font-family:"Noto Serif TC",serif; font-size:14px;
    font-weight:400;
    letter-spacing:0.1em;
    cursor:pointer;
    transition:transform 0.1s;
}

  .pause-btn:active { transform:scale(0.97); }

.end-btn {
    width:180px;
    padding:10px 30px;
    border-radius:999px;
    background:rgba(150,140,120,0.55);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.4);
    color:rgba(240,232,210,0.95);
    font-family:"Noto Serif TC",serif; font-size:14px;
    font-weight:400;
    letter-spacing:0.1em;
    cursor:pointer;
    transition:transform 0.1s;
}
  .end-btn:active { transform:scale(0.97); }

#controlBar{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  display:flex;
  gap:12px;
  align-items:center;
}

  #backToSelect {
    position:fixed; top:20px; left:18px; z-index:25;
    background:none; border:none;
    font-family:"Noto Serif TC",serif; font-size:14px;
    color:rgba(240,232,210,0.65); cursor:pointer;
    letter-spacing:0.08em;
    padding:6px 10px;
    transition:color 0.2s;
  }
  #backToSelect:active { color:rgba(240,232,210,1); }

#backHomeBtn{
    position:fixed; top:20px; left:18px; z-index:25;
    background:none; border:none;
    font-family:"Noto Serif TC",serif; font-size:14px;
    color:rgba(240,232,210,0.65); cursor:pointer;
    letter-spacing:0.08em;
    padding:6px 10px;
    transition:color 0.2s;
}

#backHomeBtn:hover{
  color:rgba(240,232,210,1);
}

#backHomeBtn:active{
  transform:scale(.95);
}


  /* ── 靜坐中背景切換列 ── */
  #bgSwitcher {
    position:fixed; bottom:90px; left:0; right:0; z-index:10;
    display:flex; justify-content:center; align-items:center;
    gap:8px; padding:0 16px;
    opacity:0; pointer-events:none;
    transition:opacity 0.4s ease;
  }
  #bgSwitcher.show { opacity:1; pointer-events:auto; }
  .bg-thumb {
    width:44px; height:33px; border-radius:6px;
    background-size:cover; background-position:center;
    border:2px solid transparent;
    cursor:pointer;
    transition:border-color 0.2s, transform 0.15s;
    flex-shrink:0;
  }
  .bg-thumb:active { transform:scale(0.9); }
  .bg-thumb.selected { border-color:rgba(240,232,210,0.9); }


  /* ── 引導「即將推出」狀態 ── */
  .item-btn.locked {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
  }
  .item-btn.locked .btn-label::after {
    content: "　即將推出";
    font-size: clamp(10px,2.5vw,12px);
    color: rgba(240,232,210,0.45);
    letter-spacing: 0.06em;
    font-family: "Noto Sans TC", sans-serif;
  }

</style>
</head>
<body>

<div id="bg"></div>
<div id="overlay"></div>

<!-- 選擇畫面：三欄 -->
<div id="selectPage">
  <button id="backHomeBtn" onclick="goHome()">←返回</button>
  <div class="page-title">
        ✼專屬於你的冥想菜單✼<br>
  	① 音樂 ＋ ② 引導
  </div>

  <div class="three-col">
    <!-- 左欄：背景音樂 -->
    <div class="col">
      <div class="col-title">① 音樂▾</div>
      <div class="item-list" id="musicList"></div>
      <div class="scroll-fade" id="musicFade"></div>
      <div class="scroll-arrow" id="musicArrow">▾</div>
    </div>

    <!-- 右欄：靜坐引導 -->
    <div class="col">
      <div class="col-title">② 引導▾</div>
      <div class="item-list" id="guideList"></div>
      <div class="scroll-fade" id="guideFade"></div>
      <div class="scroll-arrow" id="guideArrow">▾</div>
    </div>
  </div>

  <div class="start-wrap">
    <button class="start-btn" id="startBtn" onclick="startMeditation()">開始靜坐 »</button>
  </div>
</div>

<!-- 靜坐畫面 -->
<div id="meditationPage">
  <button id="backToSelect" onclick="backToSelect()">←返回</button>
  <!-- 背景切換縮圖列 -->
  <div id="bgSwitcher"></div>
  <div id="tipWrap">
    <div id="tipText"></div>
    <div id="timer">00:00</div>
  </div>
  <div id="controlBar">
    <button class="pause-btn" id="pauseBtn" onclick="togglePauseButton()">⏸ 暫停</button>
    <button class="end-btn" onclick="endMeditation()">結束靜坐</button>
  </div>
</div>

<audio id="previewMusic" loop></audio>
<audio id="previewGuide" loop></audio>
<audio id="guideAudio"></audio>
<audio id="bgAudio" loop></audio>

<script>
  const BASE = 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/';

  let selBg = null, selBgUrl = null;
  let selMusic = null, selMusicUrl = null;
  let selGuide = null, selGuideUrl = null;

  // ── 滾動提示：偵測是否還有內容可滑 ──
  function bindScrollHint(listId, fadeId, arrowId) {
    const list  = document.getElementById(listId);
    const fade  = document.getElementById(fadeId);
    const arrow = document.getElementById(arrowId);
    if (!list || !fade || !arrow) return;

    function update() {
      const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 8;
      fade.classList.toggle('hidden', atBottom);
      arrow.classList.toggle('hidden', atBottom);
    }

    list.addEventListener('scroll', update, { passive: true });
    // 等內容渲染完再判斷
    setTimeout(update, 800);
  }

  function checkReady() {
    const ready = !!(selMusic !== null && selGuide !== null);
    const wrap = document.querySelector('.start-wrap');
    if (ready) {
      wrap.classList.add('visible');
    }
  }




  // ── 載入背景場景清單（自動選第一張 + 建立靜坐中切換縮圖）──

  selBg = 'background'; selBgUrl = BASE + 'png/app_back_ground.png';
  fetch(BASE + 'backgrounds.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      const switcher = document.getElementById('bgSwitcher');


      list.forEach(function(bg, idx) {
        const url = BASE + bg.file;
        // 自動選第一張
        if (idx === 0) {
          selBg = bg.key; selBgUrl = url;
          document.getElementById('bg').style.backgroundImage = "url('" + url + "')";
        }
        // 建立靜坐中縮圖
        const thumb = document.createElement('div');
        thumb.className = 'bg-thumb';
        thumb.style.backgroundImage = "url('" + url + "')";
        thumb.title = bg.label;
        thumb.addEventListener('click', function() {
          switcher.querySelectorAll('.bg-thumb').forEach(function(t) { t.classList.remove('selected'); });
          thumb.classList.add('selected');
          selBg = bg.key; selBgUrl = url;
          document.getElementById('bg').style.backgroundImage = "url('" + url + "')";
        });
        switcher.appendChild(thumb);
      });
    })

  // ── 載入音樂清單 ──
  fetch(BASE + 'music.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      const el = document.getElementById('musicList');
      list.forEach(function(m, idx) {
        const btn = document.createElement('div');
        btn.className = 'item-btn';
        btn.textContent = m.label;
        btn.addEventListener('click', function() {
          el.querySelectorAll('.item-btn').forEach(function(b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          selMusic = m.key;
          selMusicUrl = m.file ? BASE + m.file : '';
          // 試聽
          const pa = document.getElementById('previewMusic');
          pa.pause();
          if (selMusicUrl) { pa.src = selMusicUrl; pa.volume = 0.4; pa.play().catch(function(){}); }
          checkReady();
        });
        el.appendChild(btn);
      });
    });
  bindScrollHint('musicList', 'musicFade', 'musicArrow');

  // ── 載入引導清單 ──
  fetch(BASE + 'guide.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      const el = document.getElementById('guideList');
      list.forEach(function(g, idx) {
        const btn = document.createElement('div');
        btn.className = 'item-btn';
        const hasFile = !!(g.file && g.file.trim());
        btn.innerHTML =
          '<span class="btn-label">' + g.label + '</span>' +
          (g.description ? '<span class="btn-desc">' + g.description + '</span>' : '') +
          (g.duration ? '<span class="btn-duration">⏱ ' + g.duration + '</span>' : '');
        if (!hasFile) {
          btn.classList.add('locked');
        } else {
          btn.addEventListener('click', function() {
            el.querySelectorAll('.item-btn').forEach(function(b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
            selGuide = g.key;
            selGuideUrl = BASE + g.file;
            // 試聽
            const pa = document.getElementById('previewGuide');
            pa.pause();
            pa.src = selGuideUrl; pa.volume = 0.4; pa.play().catch(function(){});
            checkReady();
          });
        }
        el.appendChild(btn);
      });
    });
  bindScrollHint('guideList', 'guideFade', 'guideArrow');

  // ── 返回選擇畫面 ──
  function goHome(){
    sessionStorage.setItem('fromMeditation', '1');
    window.location.href = 'index.html';
  }

  // ── 返回選擇畫面 ──
  function backToSelect() {
    document.getElementById('guideAudio').pause();
    document.getElementById('bgAudio').pause();
    document.getElementById('previewMusic').pause();
    document.getElementById('previewGuide').pause();
    clearInterval(timerInterval);
    seconds = 0; paused = false;
    const pb=document.getElementById('pauseBtn'); if(pb) pb.innerHTML='⏸ 暫停';
    document.getElementById('timer').textContent = '00:00';
    document.getElementById('tipText').innerHTML = '';
    document.getElementById('bgSwitcher').classList.remove('show');
    document.getElementById('meditationPage').classList.remove('show');
    document.getElementById('selectPage').classList.remove('hide');
    document.getElementById('overlay').style.background = 'rgba(10,12,8,0.5)';
  }

  // ── 開始靜坐 ──
  function startMeditation() {
    paused = false;
    const pb=document.getElementById('pauseBtn'); if(pb) pb.innerHTML='⏸ 暫停';
    document.getElementById('previewMusic').pause();
    document.getElementById('previewGuide').pause();
    document.getElementById('selectPage').classList.add('hide');
    document.getElementById('overlay').style.background = 'rgba(10,12,8,0.5)';

    const guideAudio = document.getElementById('guideAudio');
    const bgAudio = document.getElementById('bgAudio');

    if (selGuideUrl) {
      guideAudio.src = selGuideUrl;
      guideAudio.volume = 1.0;
      guideAudio.play().catch(function(e) { console.log(e); });
    }
    if (selMusicUrl) {
      bgAudio.src = selMusicUrl;
      bgAudio.volume = 0.02;
      bgAudio.play().catch(function(e) { console.log(e); });
    }

    document.getElementById('meditationPage').classList.add('show');
    document.getElementById('bgSwitcher').classList.add('show');

    startTimer();
    loadTips();

    guideAudio.addEventListener('ended', function() {
      if (seconds >= 60) endMeditation();
    });
  }

  // ── 計時器 ──
  let seconds = 0, paused = false, timerInterval = null;

  function startTimer() {
    timerInterval = setInterval(function() {
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      document.getElementById('timer').textContent = m + ':' + s;
    }, 1000);
  }

  // ── 靜心提示語 ──
  let tips = [], tipIndex = 0;

  function loadTips() {
    fetch(BASE + 'tips.json?t=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(list) {
        tips = list.sort(function() { return Math.random()-0.5; });
        showTip(0);
        setInterval(function() {
          tipIndex = (tipIndex+1) % tips.length;
          showTip(tipIndex);
        }, 30000);
      })
      .catch(function() {
        tips = [{ text:'讓思想安靜下來，只是觀察。' }];
        showTip(0);
      });
  }

  function showTip(idx) {
    const tipEl = document.getElementById('tipText');
    tipEl.style.transition = 'opacity 1s ease';
    tipEl.style.opacity = '0';
    setTimeout(function() {
      tipEl.innerHTML = '';
      tipEl.style.opacity = '1';
      tips[idx].text.split('').forEach(function(ch, i) {
        const span = document.createElement('span');
        span.className = 'char'; span.textContent = ch;
        span.style.animationDelay = (i * 0.1) + 's';
        tipEl.appendChild(span);
      });
    }, 1000);
  }

  // ── 暫停／繼續 ──
  function togglePauseButton() {

    const btn = document.getElementById('pauseBtn');

    if (!paused) {
      paused = true;
      document.getElementById('guideAudio').pause();
      document.getElementById('bgAudio').pause();
      clearInterval(timerInterval);
      btn.innerHTML = '▶ 繼續';
    } else {
      paused = false;
      document.getElementById('guideAudio').play().catch(function(){});
      if (selMusicUrl) {
        document.getElementById('bgAudio').play().catch(function(){});
      }
      startTimer();
      btn.innerHTML = '⏸ 暫停';
    }
  }


  function endMeditation() {
    document.getElementById('guideAudio').pause();
    document.getElementById('bgAudio').pause();
    clearInterval(timerInterval);

    const today = new Date().toDateString();
    const lastDate = localStorage.getItem('sahaja_last_date');
    let streak = parseInt(localStorage.getItem('sahaja_streak') || '0');
    if (lastDate !== today) {
      const yesterday = new Date(Date.now()-86400000).toDateString();
      streak = (lastDate === yesterday) ? streak+1 : 1;
      localStorage.setItem('sahaja_streak', streak);
      localStorage.setItem('sahaja_last_date', today);
    }
    localStorage.setItem('sahaja_last_duration', seconds);

    window.location.href = 'feedback.html';
  }
</script>
</body>
</html>
