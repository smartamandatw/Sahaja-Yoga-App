<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sahaja Yoga</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"Noto Sans TC",sans-serif; }
  @keyframes fadeChar { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }

  #bg {
    position:fixed; inset:0; z-index:0;
    background-size:cover; background-position:center;
    transition:background-image 0.6s ease;
  }
  #overlay {
    position:fixed; inset:0; z-index:1;
    background:rgba(10,12,8,0.5);
    transition:background 0.5s;
  }

  /* ── 選擇頁（三欄） ── */
  #selectPage {
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding:0; overflow:hidden;
    opacity:1; pointer-events:auto;
    transition:opacity 0.5s ease;
  }
  #selectPage.hide { opacity:0; pointer-events:none; }

  .page-title {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(15px,4vw,18px);
    color:rgba(240,232,210,0.85);
    letter-spacing:0.2em; text-align:center;
    padding:clamp(14px,4vh,22px) 0 clamp(8px,2vh,14px);
    text-shadow:0 1px 8px rgba(0,0,0,0.4);
    flex-shrink:0;
  }

  /* 三欄主體 */
  .three-col {
    display:flex; flex-direction:row;
    width:100%; flex:1; min-height:0;
    gap:0; overflow:hidden;
  }

  /* 每欄 */
  .col {
    flex:1; display:flex; flex-direction:column;
    align-items:center; padding:0 6px;
    overflow:hidden;
  }
  .col + .col {
    border-left:1px solid rgba(240,232,210,0.15);
  }

  .col-title {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(11px,3vw,13px);
    color:rgba(240,232,210,0.55);
    letter-spacing:0.18em; text-align:center;
    margin-bottom:8px; flex-shrink:0;
  }

  /* 背景場景：直排 */
  .bg-list {
    display:flex; flex-direction:column;
    gap:6px; width:100%;
    overflow-y:auto; flex:1;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:4px;
  }
  .bg-list::-webkit-scrollbar { display:none; }

  .bg-card {
    position:relative; border-radius:8px;
    overflow:hidden; cursor:pointer;
    flex-shrink:0; aspect-ratio:4/3;
    border:2px solid transparent;
    transition:border-color 0.2s, transform 0.15s;
    background:#111;
  }
  .bg-card:active { transform:scale(0.96); }
  .bg-card.selected { border-color:rgba(240,232,210,0.9); }
  .bg-card.selected::after {
    content:"✓"; position:absolute; top:5px; right:7px;
    font-size:12px; color:#F0E8D0;
    text-shadow:0 1px 4px rgba(0,0,0,0.7);
  }
  .bg-img { width:100%; height:100%; background-size:cover; background-position:center; }
  .bg-label {
    position:absolute; bottom:0; left:0; right:0;
    padding:5px 4px;
    background:linear-gradient(transparent,rgba(0,0,0,0.7));
    font-size:clamp(9px,2.4vw,11px);
    color:#F0E8D0; text-align:center; letter-spacing:0.05em;
  }

  /* 音樂／引導：直排列表 */
  .item-list {
    display:flex; flex-direction:column;
    gap:7px; width:100%;
    overflow-y:auto; flex:1;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:4px;
  }
  .item-list::-webkit-scrollbar { display:none; }

  .item-btn {
    padding:11px 8px; border-radius:10px;
    border:0.5px solid rgba(255,255,255,0.18);
    background:rgba(230,220,200,0.08); backdrop-filter:blur(8px);
    color:rgba(240,232,210,0.75);
    font-family:"Noto Serif TC",serif;
    font-size:clamp(11px,2.8vw,13px); letter-spacing:0.06em;
    cursor:pointer; text-align:center; line-height:1.4;
    transition:background 0.2s, border-color 0.2s, transform 0.1s;
    flex-shrink:0;
  }
  .item-btn:active { transform:scale(0.97); }
  .item-btn.selected {
    background:rgba(230,220,200,0.25);
    border-color:rgba(240,232,210,0.65);
    color:#F0E8D0;
  }

  /* 開始按鈕 */
  .start-wrap {
    flex-shrink:0;
    padding:clamp(10px,2.5vh,16px) 0 clamp(12px,3vh,20px);
  }
  .start-btn {
    padding:14px 44px; border-radius:999px;
    background:rgba(210,200,178,0.52); backdrop-filter:blur(10px);
    border:0.5px solid rgba(255,255,255,0.45);
    color:#1C1609; font-family:"Noto Sans TC",sans-serif;
    font-size:clamp(15px,4vw,17px); letter-spacing:0.1em;
    cursor:pointer; transition:background 0.2s, transform 0.1s;
  }
  .start-btn:active { transform:scale(0.97); }
  .start-btn:disabled { opacity:0.35; pointer-events:none; }

  /* ── 靜坐畫面 ── */
  #meditationPage {
    position:fixed; inset:0; z-index:5;
    opacity:0; pointer-events:none;
    transition:opacity 0.8s ease;
  }
  #meditationPage.show { opacity:1; pointer-events:auto; }

  #timer {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(16px,4.5vw,20px);
    color:rgba(240,232,210,0.55); letter-spacing:0.2em;
    pointer-events:none; text-align:center;
    margin-top:16px;
  }

  #tipWrap {
    position:fixed; top:68%; left:0; right:0; z-index:6;
    display:flex; flex-direction:column; align-items:center; gap:20px;
    padding:0 clamp(24px,7vw,48px); pointer-events:none;
  }
  #tipText {
    font-family:"Noto Serif TC",serif;
    font-size:clamp(16px,4.5vw,20px);
    color:rgba(240,232,210,0.8); line-height:2; letter-spacing:0.15em;
    text-align:center; text-shadow:0 1px 8px rgba(0,0,0,0.5);
  }
  #tipText .char { opacity:0; display:inline-block; animation:fadeChar 0.5s ease forwards; }

  #tapLayer { position:fixed; inset:0; z-index:15; cursor:pointer; display:none; }
  #tapLayer.show { display:block; }

  #pauseOverlay {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding-bottom:6vh; gap:16px;
    background:rgba(10,12,8,0.6);
    opacity:0; pointer-events:none; transition:opacity 0.3s;
  }
  #pauseOverlay.show { opacity:1; pointer-events:auto; }

.pause-btn {
    padding:20px 60px;
    border-radius:999px;
    background:rgba(210,200,178,0.65);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.5);
    color:#1C1609;
    font-family:"Noto Sans TC",sans-serif;
    font-size:clamp(18px,5vw,22px);
    font-weight:600;
    letter-spacing:0.1em;
    cursor:pointer;
    transition:transform 0.1s;
}

  .pause-btn:active { transform:scale(0.97); }

.end-btn {
    padding:20px 50px;
    border-radius:999px;
    background:rgba(150,140,120,0.55);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.4);
    color:rgba(240,232,210,0.95);
    font-family:"Noto Sans TC",sans-serif;
    font-size:clamp(17px,4.5vw,20px);
    font-weight:600;
    letter-spacing:0.1em;
    cursor:pointer;
    transition:transform 0.1s;
}
  .end-btn:active { transform:scale(0.97); }

#controlBar{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  display:flex;
  gap:12px;
  align-items:center;
}

  #backToSelect {
    position:fixed; top:20px; left:18px; z-index:25;
    background:none; border:none;
    font-family:"Noto Serif TC",serif; font-size:14px;
    color:rgba(240,232,210,0.65); cursor:pointer;
    letter-spacing:0.08em;
    padding:6px 10px;
    transition:color 0.2s;
  }
  #backToSelect:active { color:rgba(240,232,210,1); }

#backHomeBtn{
  position:fixed;
  top:20px;
  left:18px;
  z-index:10;
  background:none;
  border:none;
  color:rgba(240,232,210,0.75);
  font-family:"Noto Serif TC",serif;
  font-size:14px;
  letter-spacing:0.08em;
  cursor:pointer;
  padding:6px 10px;
  transition:all .2s;
}

#backHomeBtn:hover{
  color:rgba(240,232,210,1);
}

#backHomeBtn:active{
  transform:scale(.95);
}

</style>
</head>
<body>

<div id="bg"></div>
<div id="overlay"></div>

<!-- 選擇畫面：三欄 -->
<div id="selectPage">
  <button id="backHomeBtn" onclick="goHome()">← 主畫面</button>
  <div class="page-title">選擇你的靜坐體驗</div>

  <div class="three-col">
    <!-- 左欄：背景場景 -->
    <div class="col">
      <div class="col-title">場　景</div>
      <div class="bg-list" id="bgList"></div>
    </div>

    <!-- 中欄：背景音樂 -->
    <div class="col">
      <div class="col-title">音　樂</div>
      <div class="item-list" id="musicList"></div>
    </div>

    <!-- 右欄：靜坐引導 -->
    <div class="col">
      <div class="col-title">引　導</div>
      <div class="item-list" id="guideList"></div>
    </div>
  </div>

  <div class="start-wrap">
    <button class="start-btn" id="startBtn" disabled onclick="startMeditation()">開始靜坐 »</button>
  </div>
</div>

<!-- 靜坐畫面 -->
<div id="meditationPage">
  <button id="backToSelect" onclick="backToSelect()">← 返回</button>
  <div id="tipWrap">
    <div id="tipText"></div>
    <div id="timer">00:00</div>
  </div>
  <div id="controlBar">
    <button class="pause-btn" id="pauseBtn" onclick="togglePauseButton()">⏸ 暫停</button>
    <button class="end-btn" onclick="endMeditation()">結束靜坐</button>
  </div>
</div>

<audio id="previewAudio" loop></audio>
<audio id="guideAudio"></audio>
<audio id="bgAudio" loop></audio>

<script>
  const BASE = 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/';

  const BG_LIST = [
    { key:'forest',     label:'🌲 霧中森林',    file:'forest.png' },
    { key:'lake',       label:'🌊 湖面夜景',    file:'lake.png' },
    { key:'stars',      label:'✨ 星空銀河',    file:'stars.png' },
    { key:'sun',        label:'🌅 山間日出',    file:'sun.png' },
    { key:'shrimataji', label:'🙏 Shri Mataji', file:'ShriMataji.png' },
    { key:'flower',     label:'🌸 夕陽野花',    file:'flower.png' },
  ];

  let selBg = null, selBgUrl = null;
  let selMusic = null, selMusicUrl = null;
  let selGuide = null, selGuideUrl = null;

  function checkReady() {
    document.getElementById('startBtn').disabled = !(selBg && selMusic !== null && selGuide !== null);
  }

  // ── 建立背景卡片（直排）──
  const bgListEl = document.getElementById('bgList');
  BG_LIST.forEach(function(bg) {
    const url = BASE + bg.file;
    const card = document.createElement('div');
    card.className = 'bg-card';
    card.innerHTML =
      '<div class="bg-img" style="background-image:url(\'' + url + '\')"></div>' +
      '<div class="bg-label">' + bg.label + '</div>';
    card.addEventListener('click', function() {
      bgListEl.querySelectorAll('.bg-card').forEach(function(c) { c.classList.remove('selected'); });
      card.classList.add('selected');
      selBg = bg.key; selBgUrl = url;
      document.getElementById('bg').style.backgroundImage = "url('" + url + "')";
      checkReady();
    });
    bgListEl.appendChild(card);
  });

  // 預設第一張
  selBg = BG_LIST[0].key;
  selBgUrl = BASE + BG_LIST[0].file;
  bgListEl.children[0].classList.add('selected');
  document.getElementById('bg').style.backgroundImage = "url('" + selBgUrl + "')";

  // ── 載入音樂清單 ──
  fetch(BASE + 'music.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      const el = document.getElementById('musicList');
      list.forEach(function(m, idx) {
        const btn = document.createElement('div');
        btn.className = 'item-btn';
        btn.textContent = m.label;
        btn.addEventListener('click', function() {
          el.querySelectorAll('.item-btn').forEach(function(b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          selMusic = m.key;
          selMusicUrl = m.file ? BASE + m.file : '';
          // 試聽
          const pa = document.getElementById('previewAudio');
          pa.pause();
          if (selMusicUrl) { pa.src = selMusicUrl; pa.volume = 0.4; pa.play().catch(function(){}); }
          checkReady();
        });
        el.appendChild(btn);
        if (idx === 0) {
          btn.classList.add('selected');
          selMusic = m.key;
          selMusicUrl = m.file ? BASE + m.file : '';
          checkReady();
        }
      });
    });

  // ── 載入引導清單 ──
  fetch(BASE + 'guide.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      const el = document.getElementById('guideList');
      list.forEach(function(g, idx) {
        const btn = document.createElement('div');
        btn.className = 'item-btn';
        btn.textContent = g.label;
        btn.addEventListener('click', function() {
          el.querySelectorAll('.item-btn').forEach(function(b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          selGuide = g.key;
          selGuideUrl = g.file ? BASE + g.file : '';
          checkReady();
        });
        el.appendChild(btn);
        if (idx === 0) {
          btn.classList.add('selected');
          selGuide = g.key;
          selGuideUrl = g.file ? BASE + g.file : '';
          checkReady();
        }
      });
    });

  // ── 返回選擇畫面 ──
  function goHome(){
    sessionStorage.setItem('fromMeditation', '1');
    window.location.href = 'index.html';
  }

  // ── 返回選擇畫面 ──
  function backToSelect() {
    document.getElementById('guideAudio').pause();
    document.getElementById('bgAudio').pause();
    document.getElementById('previewAudio').pause();
    clearInterval(timerInterval);
    seconds = 0; paused = false;
    const pb=document.getElementById('pauseBtn'); if(pb) pb.innerHTML='⏸ 暫停';
    document.getElementById('timer').textContent = '00:00';
    document.getElementById('tipText').innerHTML = '';
    document.getElementById('meditationPage').classList.remove('show');
    document.getElementById('selectPage').classList.remove('hide');
    document.getElementById('overlay').style.background = 'rgba(10,12,8,0.5)';
  }

  // ── 開始靜坐 ──
  function startMeditation() {
    paused = false;
    const pb=document.getElementById('pauseBtn'); if(pb) pb.innerHTML='⏸ 暫停';
    document.getElementById('previewAudio').pause();
    document.getElementById('selectPage').classList.add('hide');
    document.getElementById('overlay').style.background = 'rgba(10,12,8,0.5)';

    const guideAudio = document.getElementById('guideAudio');
    const bgAudio = document.getElementById('bgAudio');

    if (selGuideUrl) {
      guideAudio.src = selGuideUrl;
      guideAudio.volume = 1.0;
      guideAudio.play().catch(function(e) { console.log(e); });
    }
    if (selMusicUrl) {
      bgAudio.src = selMusicUrl;
      bgAudio.volume = 0.02;
      bgAudio.play().catch(function(e) { console.log(e); });
    }

    document.getElementById('meditationPage').classList.add('show');

    startTimer();
    loadTips();

    guideAudio.addEventListener('ended', function() {
      if (seconds >= 60) endMeditation();
    });
  }

  // ── 計時器 ──
  let seconds = 0, paused = false, timerInterval = null;

  function startTimer() {
    timerInterval = setInterval(function() {
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      document.getElementById('timer').textContent = m + ':' + s;
    }, 1000);
  }

  // ── 靜心提示語 ──
  let tips = [], tipIndex = 0;

  function loadTips() {
    fetch(BASE + 'tips.json?t=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(list) {
        tips = list.sort(function() { return Math.random()-0.5; });
        showTip(0);
        setInterval(function() {
          tipIndex = (tipIndex+1) % tips.length;
          showTip(tipIndex);
        }, 30000);
      })
      .catch(function() {
        tips = [{ text:'讓思想安靜下來，只是觀察。' }];
        showTip(0);
      });
  }

  function showTip(idx) {
    const tipEl = document.getElementById('tipText');
    tipEl.style.transition = 'opacity 1s ease';
    tipEl.style.opacity = '0';
    setTimeout(function() {
      tipEl.innerHTML = '';
      tipEl.style.opacity = '1';
      tips[idx].text.split('').forEach(function(ch, i) {
        const span = document.createElement('span');
        span.className = 'char'; span.textContent = ch;
        span.style.animationDelay = (i * 0.1) + 's';
        tipEl.appendChild(span);
      });
    }, 1000);
  }

  // ── 暫停／繼續 ──
  function togglePauseButton() {

    const btn = document.getElementById('pauseBtn');

    if (!paused) {
      paused = true;
      document.getElementById('guideAudio').pause();
      document.getElementById('bgAudio').pause();
      clearInterval(timerInterval);
      btn.innerHTML = '▶ 繼續';
    } else {
      paused = false;
      document.getElementById('guideAudio').play().catch(function(){});
      if (selMusicUrl) {
        document.getElementById('bgAudio').play().catch(function(){});
      }
      startTimer();
      btn.innerHTML = '⏸ 暫停';
    }
  }


  function endMeditation() {
    document.getElementById('guideAudio').pause();
    document.getElementById('bgAudio').pause();
    clearInterval(timerInterval);

    const today = new Date().toDateString();
    const lastDate = localStorage.getItem('sahaja_last_date');
    let streak = parseInt(localStorage.getItem('sahaja_streak') || '0');
    if (lastDate !== today) {
      const yesterday = new Date(Date.now()-86400000).toDateString();
      streak = (lastDate === yesterday) ? streak+1 : 1;
      localStorage.setItem('sahaja_streak', streak);
      localStorage.setItem('sahaja_last_date', today);
    }
    localStorage.setItem('sahaja_last_duration', seconds);

    window.location.href = 'feedback.html';
  }
</script>
</body>
</html>
