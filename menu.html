<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sahaja Yoga — 功能選單</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; font-family:"Noto Sans TC",sans-serif; }

#bg {
  position:fixed; inset:0; z-index:0;
  background-size:cover; background-position:center;
}
#overlay {
  position:fixed; inset:0; z-index:1;
  background: linear-gradient(
    to bottom,
    rgba(10,12,8,0.50) 0%,
    rgba(10,12,8,0.68) 50%,
    rgba(10,12,8,0.78) 100%
  );
}

.container {
  position: fixed; inset:0; z-index:5;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 0 14px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.header {
  width:100%; max-width:420px;
  display: flex; align-items: center; justify-content: space-between;
  padding-top: max(env(safe-area-inset-top), 10px);
  padding-bottom: 16px;
  flex-shrink: 0;
}
.back-btn {
    position:fixed; top:20px; left:18px; z-index:25;
    background:none; border:none;
    font-family:"Noto Serif TC",serif; font-size:14px;
    color:rgba(240,232,210,0.65); cursor:pointer;
    letter-spacing:0.08em;
    padding:6px 10px;
    transition:color 0.2s;
}
.back-btn:active { color: rgba(240,232,210,0.9); }

.header-title {
  font-family:"Noto Serif TC",serif;
  font-size: clamp(15px,4vw,17px);
  color: rgba(240,232,210,0.80);
  letter-spacing: 0.2em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}
.header-spacer { width: 52px; }

.grid {
  width:100%; max-width:420px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding-bottom: max(env(safe-area-inset-bottom), 28px);
  flex-shrink: 0;
}

.card {
  border-radius: 16px;
  padding: 22px 18px 20px;
  background: rgba(243, 147, 14, 0.34);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 0.5px solid rgba(240,232,210,0.14);
  cursor: pointer;
  display: flex; flex-direction: column;
  gap: 10px;
  min-height: 148px;
  position: relative; overflow: hidden;
  transition: transform 0.15s, background 0.2s;
}
.card:active {
  transform: scale(0.96);
  background: rgba(55,48,40,0.80);
}
.card.coming-soon { opacity: 0.55; }
.card.available {
  border-color: rgba(244, 149, 39, 0.8);
  background: rgba(243, 122, 30, 0.68);
}

.card-icon { font-size: 26px; line-height: 1; }
.card-body {
  flex: 1;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  gap: 5px;
}
.card-label {
  font-family:"Noto Serif TC",serif;
  font-size: clamp(16px,4.5vw,19px);
  color: rgba(240,232,210,0.92);
  letter-spacing: 0.06em;
  line-height: 1.35;
  font-weight: 600;
}
.card-desc {
  font-family:"Noto Sans TC",sans-serif;
  font-size: clamp(11px,2.8vw,12px);
  color: rgba(240,232,210,0.45);
  letter-spacing: 0.04em;
  line-height: 1.5;
}

.badge-soon {
  position: absolute; top: 12px; right: 12px;
  font-family:"Noto Sans TC",sans-serif;
  font-size: 9px;
  letter-spacing: 0.05em;
  color: rgba(158, 94, 21, 0.8);
  border: 0.5px solid rgba(240,232,210,0.2);
  border-radius: 999px;
  padding: 2px 7px;
}

.toast {
  position: fixed;
  bottom: max(env(safe-area-inset-bottom), 40px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  z-index: 100;
  background: rgba(30,26,23,0.90);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 0.5px solid rgba(240,232,210,0.2);
  border-radius: 999px;
  padding: 12px 28px;
  font-family:"Noto Serif TC",serif;
  font-size: clamp(13px,3.5vw,15px);
  color: rgba(240,232,210,0.75);
  letter-spacing: 0.12em;
  white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
}
.toast.show { opacity:1; transform: translateX(-50%) translateY(0); }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}
.card { opacity:0; animation: fadeUp 0.45s ease forwards; }
.card:nth-child(1) { animation-delay:0.04s; }
.card:nth-child(2) { animation-delay:0.10s; }
.card:nth-child(3) { animation-delay:0.16s; }
.card:nth-child(4) { animation-delay:0.22s; }
.card:nth-child(5) { animation-delay:0.28s; }
.card:nth-child(6) { animation-delay:0.34s; }
.card:nth-child(7) { animation-delay:0.40s; }
.card:nth-child(8) { animation-delay:0.46s; }
.header-title { opacity:0; animation: fadeUp 0.4s ease forwards 0s; }
</style>
</head>
<body>

<div id="bg"></div>
<div id="overlay"></div>

<div class="container">
  <div class="header">
    <button class="back-btn" onclick="goBack()">←返回</button>
    <div class="header-spacer"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast">✦ 即將開放，敬請期待</div>

<script>
const BASE = 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/';
document.getElementById('bg').style.backgroundImage = "url('" + BASE + "app_background.png')";

let toastTimer = null;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function goBack() {
    sessionStorage.setItem('fromMeditation', '1');
    window.location.href = 'index.html';
}

fetch(BASE + 'menu.json?t=' + Date.now())
  .then(r => r.json())
  .then(items => {
    const grid = document.getElementById('grid');
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'card' + (item.coming_soon ? ' coming-soon' : ' available');
      el.innerHTML =
        '<div class="card-icon">' + item.icon + '</div>' +
        '<div class="card-body">' +
          '<div class="card-label">' + item.label + '</div>' +
          '<div class="card-desc">' + item.desc + '</div>' +
        '</div>' +
        (item.coming_soon ? '<span class="badge-soon">即將開放</span>' : '');
      el.addEventListener('click', () => {
        if (item.url) window.location.href = item.url;
        else showToast();
      });
      grid.appendChild(el);
    });
  })
  .catch(() => {
    document.getElementById('grid').innerHTML =
      '<p style="color:rgba(240,232,210,0.4);padding:40px;grid-column:span 2;text-align:center;font-family:Noto Serif TC,serif;">載入失敗，請稍後再試</p>';
  });
</script>

</body>
</html>
