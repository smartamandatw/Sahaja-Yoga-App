/* warm gradient bg */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 10% 0%,  rgba(201,168,76,.13) 0%,transparent 50%),
    radial-gradient(ellipse at 90% 100%,rgba(201,168,76,.10) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(255,245,220,.4) 0%,transparent 70%);
}

/* ── TOP NAV ── */
.top-nav{
  position:sticky;top:0;z-index:20;
  background:rgba(240,232,208,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 12px;
  padding-top:max(env(safe-area-inset-top,0px),14px);
}
.back-btn{
  font-size:13px;color:var(--muted);
  background:var(--soft);border:1px solid var(--gold-dim);
  border-radius:10px;padding:6px 12px;cursor:pointer;
  font-family:"Noto Sans TC",sans-serif;
  transition:background .2s;white-space:nowrap;
}
.back-btn:active{background:var(--gold-dim);}
.nav-title{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(14px,3.8vw,16px);
  color:var(--text);letter-spacing:.12em;
  position:absolute;left:50%;transform:translateX(-50%);
}
.nav-spacer{width:72px;}

/* ── HERO ── */
.hero{
  position:relative;z-index:1;
  padding:28px 20px 20px;text-align:center;
  animation:fadeUp .6s ease both;
}
.hero-tag{
  display:inline-block;background:var(--soft);color:var(--gold);
  font-size:11px;letter-spacing:3px;padding:4px 14px;
  border-radius:20px;margin-bottom:12px;border:1px solid var(--gold-dim);
}
.hero h1{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(1.4rem,4.5vw,1.75rem);
  font-weight:700;color:var(--text);line-height:1.4;margin-bottom:8px;
}
.hero h1 em{font-style:normal;color:var(--gold);}
.hero-desc{font-size:13px;color:var(--muted);line-height:1.9;max-width:280px;margin:0 auto;}

/* ── GRID ── */
.grid{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 14px;
  padding-bottom:max(env(safe-area-inset-bottom,0px),40px);
  margin-bottom:0;
}

/* ── CARDS ── */
.card{
  border-radius:20px;
  padding:20px 18px 18px;
  background:var(--card);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--card-b);
  cursor:pointer;
  display:flex;flex-direction:column;gap:10px;
  min-height:140px;
  position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .2s;
  opacity:0;animation:fadeUp .45s ease forwards;
}
.card:active{transform:scale(0.96);box-shadow:0 2px 12px rgba(201,168,76,.1);}
.card:not(.coming-soon):hover{box-shadow:0 4px 20px rgba(201,168,76,.15);}

.card.coming-soon{opacity:0!important;animation:fadeUp .45s ease forwards;border-color:var(--gold-dim);background:rgba(255,255,255,.45);}
.card.coming-soon .card-label,.card.coming-soon .card-desc{opacity:.45;}
.card.coming-soon .card-icon{opacity:.4;filter:grayscale(30%);}

/* staggered delays */
.card:nth-child(1){animation-delay:.05s} .card:nth-child(2){animation-delay:.10s}
.card:nth-child(3){animation-delay:.15s} .card:nth-child(4){animation-delay:.20s}
.card:nth-child(5){animation-delay:.25s} .card:nth-child(6){animation-delay:.30s}
.card:nth-child(7){animation-delay:.35s} .card:nth-child(8){animation-delay:.40s}
.card:nth-child(9){animation-delay:.45s} .card:nth-child(10){animation-delay:.50s}

/* gold accent strip on available cards */
.card:not(.coming-soon)::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.5;
}

.card-icon{font-size:26px;line-height:1;}

.card-body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;}
.card-label{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(14px,4vw,17px);
  color:var(--text);letter-spacing:.04em;
  line-height:1.35;font-weight:700;
}
.card-desc{
  font-size:clamp(10.5px,2.6vw,11.5px);
  color:var(--muted);letter-spacing:.02em;line-height:1.5;
}

.badge-soon{
  position:absolute;top:11px;right:11px;
  font-family:"Noto Sans TC",sans-serif;font-size:9px;
  letter-spacing:.04em;color:var(--muted);
  background:var(--soft);border:1px solid var(--gold-dim);
  border-radius:999px;padding:2px 8px;
}

/* ── TOAST ── */
.toast{
  position:fixed;
  bottom:max(env(safe-area-inset-bottom,0px),40px);
  left:50%;transform:translateX(-50%) translateY(16px);
  z-index:100;
  background:var(--text);color:var(--bg);
  border-radius:999px;padding:11px 26px;
  font-family:"Noto Serif TC",serif;font-size:13px;
  letter-spacing:.1em;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
</style>

</div>

<div class="grid" id="grid"></div>

<div class="toast" id="toast">✦ 即將開放，敬請期待</div>

<script>
const BASE = 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/';

let toastTimer = null;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function goBack() {
  sessionStorage.setItem('fromMeditation', '1');
  window.location.href = 'index.html';
}

fetch(BASE + 'menu.json?t=' + Date.now())
  .then(r => r.json())
  .then(items => {
    const grid = document.getElementById('grid');
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'card' + (item.coming_soon ? ' coming-soon' : '');
      el.innerHTML =
        `<div class="card-icon">${item.icon}</div>
         <div class="card-body">
           <div class="card-label">${item.label}</div>
           <div class="card-desc">${item.desc}</div>
         </div>` +
        (item.coming_soon ? '<span class="badge-soon">即將開放</span>' : '');
      el.addEventListener('click', () => {
        if (item.url) window.location.href = item.url;
        else showToast();
      });
      grid.appendChild(el);
    });
  })
  .catch(() => {
    document.getElementById('grid').innerHTML =
      '<p style="color:var(--muted);padding:40px;grid-column:span 2;text-align:center;font-family:\'Noto Serif TC\',serif;">載入失敗，請稍後再試</p>';
  });
</script>
</body>
</html>
