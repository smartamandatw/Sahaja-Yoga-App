<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sahaja Yoga — 功能選單</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* ── 主色系 ── */
  --bg:           #F0E8D0;              /* 頁面底色：暖米白 */
  --text:         #1C1A17;              /* 主要文字：深墨 */
  --muted:        #7a6e5f;              /* 次要文字：灰褐 */
  --gold:         #C9A84C;              /* 強調色：金 */

  /* ── 衍生色（自動從主色計算，改主色這裡跟著變） ── */
  --gold-dim:     rgba(201,168,76,0.22);  /* 金色邊框、淡背景 */
  --soft:         rgba(201,168,76,0.10);  /* 極淡金底 */
  --card:         rgba(255,255,255,0.75); /* 卡片底色 */
  --card-b:       rgba(201,168,76,0.22);  /* 卡片邊框 */
  --bg-blur:      rgba(240,232,208,0.94); /* nav 毛玻璃背景 */
  --bg-hint:      rgba(240,232,208,0.85); /* scroll hint 背景 */
  --card-coming:  rgba(255,255,255,0.45); /* 即將開放卡片底色 */
  --shadow-sm:    rgba(201,168,76,0.10);  /* 輕陰影 */
  --shadow-md:    rgba(201,168,76,0.15);  /* 中陰影 */
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100%;font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}

/* warm gradient bg */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 10% 0%,  rgba(201,168,76,.13) 0%,transparent 50%),
    radial-gradient(ellipse at 90% 100%,rgba(201,168,76,.10) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(255,245,220,.4) 0%,transparent 70%);
    background-image: url("https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/png/app_back_ground.png");
    background-size: cover;
    background-position: center;
}

/* ── TOP NAV ── */
.top-nav{
  position:sticky;top:0;z-index:20;
  background:var(--bg-blur);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 12px;
  padding-top:max(env(safe-area-inset-top,0px),14px);
}
.back-btn {
  font-family:"Noto Sans TC",sans-serif; font-size:13px;
  color:var(--muted); background:var(--soft);
  border:1px solid var(--gold); border-radius:10px;
  padding:6px 12px; cursor:pointer;
  transition:background .2s,color .2s; white-space:nowrap;
}
.back-btn:active { background:var(--gold-dim); color:var(--text); }
.nav-title{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(14px,3.8vw,16px);
  color:var(--text);letter-spacing:.12em;
  position:absolute;left:50%;transform:translateX(-50%);
}
.nav-spacer{width:72px;}

/* ── HERO ── */
.hero{
  position:relative;z-index:1;
  padding:28px 20px 20px;text-align:center;
  animation:fadeUp .6s ease both;
}
.hero-tag{
  display:inline-block;background:var(--soft);color:var(--gold);
  font-size:11px;letter-spacing:3px;padding:4px 14px;
  border-radius:20px;margin-bottom:12px;border:1px solid var(--gold-dim);
}
.hero h1{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(1.4rem,4.5vw,1.75rem);
  font-weight:700;color:var(--text);line-height:1.4;margin-bottom:8px;
}
.hero h1 em{font-style:normal;color:var(--gold);}
.hero-desc{font-size:13px;color:var(--muted);line-height:1.9;max-width:280px;margin:0 auto;}

/* ── GRID ── */
.grid{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 14px;
  padding-bottom:max(env(safe-area-inset-bottom,0px),40px);
  margin-bottom:0;
}

/* ── CARDS ── */
.card{
  border-radius:20px;
  padding:18px 16px;
  background:var(--card);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--card-b);
  cursor:pointer;
  display:flex;flex-direction:column;gap:6px;
  position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .2s;
  opacity:0;animation:fadeUp .45s ease forwards;
}
.card:active{transform:scale(0.96);box-shadow:0 2px 12px var(--shadow-sm);}
.card:not(.coming-soon):hover{box-shadow:0 4px 20px var(--shadow-md);}

.card.coming-soon{
  opacity:0!important;animation:fadeUp .45s ease forwards;
  border-color:var(--gold-dim);background:var(--card-coming);
}
.card.coming-soon .card-label,
.card.coming-soon .card-desc{opacity:.45;}

/* staggered delays */
.card:nth-child(1){animation-delay:.05s} .card:nth-child(2){animation-delay:.10s}
.card:nth-child(3){animation-delay:.15s} .card:nth-child(4){animation-delay:.20s}
.card:nth-child(5){animation-delay:.25s} .card:nth-child(6){animation-delay:.30s}
.card:nth-child(7){animation-delay:.35s} .card:nth-child(8){animation-delay:.40s}
.card:nth-child(9){animation-delay:.45s} .card:nth-child(10){animation-delay:.50s}

/* gold accent strip on available cards */
.card:not(.coming-soon)::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.5;
}

.card-body{flex:1;display:flex;flex-direction:column;gap:5px;}
.card-label{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(14px,4vw,17px);
  color:var(--text);letter-spacing:.04em;
  line-height:1.35;font-weight:700;
}
.card-desc{
  font-size:clamp(10.5px,2.6vw,11.5px);
  color:var(--muted);letter-spacing:.02em;line-height:1.5;
}

/* ── BADGE 即將開放（一直顯示） ── */
.badge-soon{
  display:inline-block;
  margin-top:6px;
  align-self:flex-start;
  font-family:"Noto Sans TC",sans-serif;font-size:9px;
  letter-spacing:.04em;color:var(--muted);
  background:var(--soft);border:1px solid var(--gold-dim);
  border-radius:999px;padding:2px 8px;
}

/* ── TOAST ── */
.toast{
  position:fixed;
  bottom:max(env(safe-area-inset-bottom,0px),40px);
  left:50%;transform:translateX(-50%) translateY(16px);
  z-index:100;
  background:var(--text);color:var(--bg);
  border-radius:999px;padding:11px 26px;
  font-family:"Noto Serif TC",serif;font-size:13px;
  letter-spacing:.1em;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── SCROLL HINT ── */
.scroll-hint{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:30;pointer-events:none;
  width:40px;height:40px;border-radius:50%;
  background:var(--bg-hint);
  border:1.5px solid var(--gold);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--gold);
  opacity:0;transition:opacity .4s;
  animation:scrollBounce 1.6s ease-in-out infinite;
}
.scroll-hint.visible{opacity:1;pointer-events:auto;}
@keyframes scrollBounce{
  0%,100%{transform:translateX(-50%) translateY(0);}
  50%{transform:translateX(-50%) translateY(5px);}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<button class="back-btn" style="position:sticky;top:16px;margin:16px 0 0 16px;z-index:20;display:inline-block;" onclick="goBack()">← 返回</button>

<div class="hero">
  <h1>今天想<em>探索</em>哪個方向？</h1>
  <span class="hero-tag">選一個你感興趣的，慢慢來</span>
</div>

<div class="grid" id="grid"></div>

<div class="scroll-hint" id="scrollHint">&#8964;</div>

<div class="toast" id="toast">✦ 即將開放，敬請期待</div>

<script>
const BASE = 'https://raw.githubusercontent.com/smartamandatw/Sahaja-Yoga-App/main/';

// ── scroll hint ──
const scrollHint = document.getElementById('scrollHint');
function updateScrollHint() {
  const scrollable = document.documentElement.scrollHeight > window.innerHeight + 40;
  const nearBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 60;
  scrollHint.classList.toggle('visible', scrollable && !nearBottom);
}
window.addEventListener('scroll', updateScrollHint, { passive:true });
window.addEventListener('resize', updateScrollHint);
setTimeout(updateScrollHint, 600);

let toastTimer = null;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function goBack() {
  sessionStorage.setItem('fromMeditation', '1');
  window.location.href = 'index.html';
}

fetch(BASE + 'menu.json?t=' + Date.now())
  .then(r => r.json())
  .then(items => {
    const grid = document.getElementById('grid');
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'card' + (item.coming_soon ? ' coming-soon' : '');
      el.innerHTML =
        `<div class="card-body">
           <div class="card-label">${item.label}</div>
           <div class="card-desc">${item.desc}</div>
           ${item.coming_soon ? '<span class="badge-soon">即將開放</span>' : ''}
         </div>`;
      el.addEventListener('click', () => {
        if (item.url) window.location.href = item.url;
        else showToast();
      });
      grid.appendChild(el);
    });
    setTimeout(updateScrollHint, 200);
  })
  .catch(() => {
    document.getElementById('grid').innerHTML =
      '<p style="color:var(--muted);padding:40px;grid-column:span 2;text-align:center;font-family:\'Noto Serif TC\',serif;">載入失敗，請稍後再試</p>';
  });
</script>
</body>
</html>
